services:
  proxy:
    # WOR-553: pin the published image, never a build context. This file is
    # downloaded standalone (see website/install-openclaw.md), so `build: ..`
    # cannot work — the user has no repo and no Dockerfile, and `docker compose
    # up` fails before anything starts.
    #
    # Published by .github/workflows/publish-docker.yml on every signed v* tag:
    # multi-arch (amd64 + arm64), cosign-signed, GHCR package flipped public.
    # Verify it yourself: `cosign verify ghcr.io/oblangatas/worthless-proxy:0.3.12`.
    #
    # The owner is written out rather than templated because compose has no
    # equivalent of the workflow's ${{ github.repository_owner }} — and GHCR does
    # NOT redirect renamed accounts, so a stale owner here is an impossible pull,
    # not a cosmetic wart. Guarded by tests/test_deploy_static.py.
    #
    # Contributors building from source:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
    # (--build matters: the override tags the local build `worthless-proxy:local`,
    #  so a plain `up` happily reuses a stale image from an earlier checkout.)
    image: ghcr.io/oblangatas/worthless-proxy:0.3.12
    ports:
      # Bind to localhost only; use a reverse proxy for external access
      - "127.0.0.1:8787:8787"
    env_file: docker-compose.env
    environment:
      # Separate fernet key from shard data — requires the worthless-secrets
      # volume below. Remove this for single-volume PaaS deployments.
      WORTHLESS_FERNET_KEY_PATH: /secrets/fernet.key
      # Used by `worthless lock` so openclaw.json gets the Docker-internal
      # service name instead of 127.0.0.1. Harmless when openclaw is not running.
      WORTHLESS_PROXY_HOST: proxy
      # Signal to _atomic_write_json to chmod openclaw.json to 0644 after
      # each write. Required because mkstemp creates 0600 files and the
      # openclaw container (node user) must be able to read what the proxy
      # (worthless user) writes on the shared openclaw-config volume.
      WORTHLESS_OPENCLAW_CONFIG_SHARED: "1"
      # Bind every interface INSIDE the container. Without these two,
      # deploy/start.py defaults WORTHLESS_DEPLOY_MODE to `loopback` and
      # _resolve_bind() returns 127.0.0.1 — the proxy then listens only on the
      # container's own loopback. The published port gives the host
      # RemoteDisconnected and the sibling `openclaw` service Connection
      # refused, while the healthcheck (which runs INSIDE the container, over
      # that same loopback) still passes. Healthy status, zero reachability.
      #
      # `lan` rather than `public`: `public` adds --proxy-headers
      # --forwarded-allow-ips, i.e. it TRUSTS X-Forwarded-For, and
      # entrypoint.sh refuses to boot without WORTHLESS_TRUSTED_PROXIES. A bare
      # compose stack has no edge proxy to trust. `lan` + an explicit host binds
      # all interfaces WITHOUT trusting forwarded headers (start.py only enables
      # --proxy-headers for `lan` when WORTHLESS_TRUSTED_PROXIES is set), which
      # is exactly what tests/openclaw/docker-compose.yml already does.
      # Host exposure is still limited by the 127.0.0.1 port publish above.
      WORTHLESS_DEPLOY_MODE: "lan"
      WORTHLESS_HOST: "0.0.0.0"
    volumes:
      - worthless-data:/data
      # Keeps the decryption key off the same volume as shard data.
      # Compromise of one volume alone cannot reconstruct API keys.
      - worthless-secrets:/secrets
      # Shared with the openclaw service — worthless lock writes openclaw.json
      # here; openclaw reads it. Always mounted so lock works correctly
      # regardless of whether the openclaw profile is active.
      - openclaw-config:/data/.openclaw
    networks:
      - frontend
      - openclaw-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      # WOR-466: Docker resets tmpfs gid to root(0) regardless of image ownership.
      # Probe drops to uid=10001 before stat(); without gid=10001 it is "other"
      # with zero access → EACCES.  Explicit uid=0,gid=10001,mode=0770 restores
      # worthless-group ownership so the healthcheck probe can traverse the dir.
      - /run/worthless:uid=0,gid=10001,mode=0770
    # WOR-310: drop all caps EXCEPT the six the runtime needs briefly
    # during entrypoint bootstrap + priv-drop dance.  preexec_fn
    # clears the bounding set before exec, so post-drop has zero caps.
    #   * SETUID/SETGID — setres*/setgroups
    #   * SETPCAP       — prctl(PR_CAPBSET_DROP)
    #   * DAC_OVERRIDE  — root must write to /data which is owned by
    #                     worthless-proxy (uid 10001) — without DAC
    #                     override root is "other" and mkdir EACCES.
    #   * CHOWN         — chown bootstrap output to worthless-proxy.
    #   * FOWNER        — chmod fernet.key (non-root-owned file).
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SETPCAP
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # OpenClaw Gateway — opt-in via: docker compose --profile openclaw up
  # Setup: printf 'OPENAI_API_KEY=<key>\n' | docker compose exec -T proxy sh -c 'cat > /tmp/.env'
  #        docker compose exec proxy worthless lock --env /tmp/.env
  #        docker compose restart openclaw
  # Full guide: website/install-openclaw.md § All-container setup
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.5.3-1@sha256:142f70fa2751bdedf03648ae427372fff3f92ac0e96ab91abb3824b088c38b7b
    profiles:
      - openclaw
    ports:
      - "127.0.0.1:18789:18789"
    environment:
      OPENCLAW_ACCEPT_TERMS: "yes"
    volumes:
      # Shared with proxy — worthless lock writes here, openclaw reads here.
      - openclaw-config:/home/node/.openclaw
    networks:
      - openclaw-net
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    user: "node"
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /run:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
    driver: bridge
  # Internal network shared between proxy and openclaw. No host access needed —
  # openclaw reaches proxy via Docker DNS (`proxy:8787`).
  openclaw-net:
    driver: bridge
    internal: true
  # Future: add `backend` with `internal: true` for Redis/DB services

volumes:
  worthless-data:
  worthless-secrets:
  # Shared openclaw config. worthless lock writes openclaw.json here;
  # openclaw reads it as /home/node/.openclaw.
  openclaw-config:
