# Grype configuration — read by anchore/scan-action when present at repo root.
#
# Ignores are time-boxed. Each entry MUST carry:
#   - vulnerability ID
#   - reason citing the upstream status
#   - linear ticket for the bump/recheck obligation
#   - expiry date (ISO YYYY-MM-DD)
#
# IMPORTANT — Grype does NOT honour `expiry`. Its IgnoreRule schema drops
# unknown keys silently, so an entry dated 2020 still suppresses its finding
# today (measured against grype 0.114.0 on 2026-08-01: a five-year-old expiry
# changed nothing, exit stayed 0). An earlier version of this header claimed
# Grype auto-re-fires past the date. It does not.
#
# The expiry is enforced by scripts/hooks/check_grype_ignore_expiry.py, wired
# into pre-commit as "supply chain: grype ignores are dated and current".
# That hook is the ONLY thing stopping a suppression from living forever.
#
# ARCHITECTURE: every reachability argument below was measured on **amd64**.
# Most rules match on `package.name` + `type`; the libstdc++ pair below also
# pins an exact `version`. Either way they apply to the arm64 image too — a
# name and type are arch-independent, and Debian ships one version string
# across arches — but the evidence behind them does not. arm64
# was scanned once (2026-08-06) and carried the identical findings; nothing
# keeps that true. WOR-873 added a weekly arm64 scan so divergence surfaces on
# a Monday rather than at a release tag. Re-MEASURE per-arch before extending.

ignore:
  # CVE-2026-85091 and CVE-2026-76844 (zlib gzFile API): waivers REMOVED
  # 2026-11-26 (worthless-kpkkm). Measured that day with grype 0.114.0, DB built 2026-11-26 06:22 UTC, ignore-free config, on an arm64 image
  # built locally 2026-11-26 from 93b602c4 (v0.3.18) and on ghcr worthless-proxy:0.3.18 amd64:
  # neither CVE matches any package. The image's apt-get upgrade now installs
  # zlib1g 1:1.3.dfsg+really1.3.1-1+deb13u1, and grype's Debian 13 record for
  # CVE-2026-85091 is "< 1:1.3.dfsg+really1.3.1-1+deb13u1", so it is fixed. For
  # CVE-2026-76844, today's database has no Debian record at all. Both
  # would have failed the expiry gate on 2026-12-08 while silencing nothing.

  - vulnerability: CVE-2026-15308
    package:
      name: python
      type: binary
    # RE-MEASURED 2026-08-02 (grype 0.114.0), five candidate bases pulled fresh.
    # There is still nowhere to upgrade to — not even a major version ahead:
    #
    #   python:3.13-slim-bookworm  3.13.14  present
    #   python:3.13-slim-trixie    3.13.14  present
    #   python:3.13-slim           3.13.14  present
    #   python:3.14-slim-trixie    3.14.6   present
    #   python:3.14-slim           3.14.6   present
    #
    # Grype's only fixed version remains 3.15.0 — a PRE-RELEASE. Shipping a
    # release-candidate interpreter to users is the worse trade against a CVE
    # whose attack surface here is bounded: non-root, network-isolated, and no
    # untrusted input parsed at the Python boundary.
    #
    # Supersedes the prior CVE-2026-7210 ignore: that one affected 3.13.13 and
    # is fixed in the current 3.13.14 base (grype no longer reports it).
    #
    # Linear: WOR-691 — bump the Docker base image when a stable 3.13.x or
    # 3.14.x backport ships, then DELETE this entry rather than extending it.
    reason: "Upstream fix only in Python 3.15.0 (pre-release). Re-measured 2026-08-02 across 3.13/3.14 slim bookworm+trixie: all still affected. Tracking WOR-691."
    expiry: "2027-01-27"  # extended on a fresh measurement, not blind. Re-measure before extending again.

  # CVE-2026-17084, CVE-2026-15806 (worthless-kzfq) and CVE-2026-12345
  # (tempfile.TemporaryDirectory cleanup race, worthless-11ix): waivers
  # REMOVED 2026-11-26 (worthless-kpkkm). Measured that day with grype 0.114.0, DB built 2026-11-26 06:22 UTC, ignore-free config, on an arm64 image
  # built locally 2026-11-26 from 93b602c4 (v0.3.18) and on ghcr worthless-proxy:0.3.18 amd64:
  # none of the three matches anything. The image runs python 3.13.18. Today's
  # NVD ranges stop below it: "< 3.13.16" for 17084 and 15806, "< 3.13.18" for
  # 12345. All three would have failed the expiry gate in December (12-08,
  # 12-08, 12-31) while silencing nothing.

  # ── libstdc++ erase_if, nothing here links it (worthless-11ix) ──────
  # A use-after-free in libstdc++: erase_if on a binary heap priority queue
  # reallocates storage without updating the internal entry pointer. Debian
  # has no fix in ANY release — gcc-12, 14, 15 and 16 are all marked
  # vulnerable, unfixed, on the security tracker (read 2026-10-05), so
  # fix=not-fixed is the real upstream state, not a stale grype record.
  #
  # MEASURED 2026-10-05, not assumed. Installed requirements.txt into
  # python:3.13-slim-trixie (amd64, Python 3.13.15) and read every compiled
  # extension's dynamic section:
  #   44 packages, 11 .so files, 0 linking libstdc++
  # The interpreter does not link it either. libstdc++ is present only
  # because the base image ships the gcc runtime; no Worthless code path
  # reaches a C++ priority queue, so erase_if is never called.
  #
  # SCOPED BY TYPE + VERSION, not by name, and the expiry hook is why. It
  # rejects any package name holding a regex activator, because grype turns
  # such a name into a full-match regex and the ignore then silences packages
  # it never named. `libstdc++6` carries two `+`, and escaping them adds `\` —
  # also an activator — so there is no spelling of that name the hook accepts.
  #
  # An earlier revision of these two entries therefore carried NO `package`
  # key at all, and said so, calling the cost "tolerable". It was not: an empty
  # scope USED TO make check_grype_unmapped_findings return True for the CVE id
  # on EVERY package in every ecosystem, including a future first-party one
  # nobody measured. It now matches nothing instead. That gap
  # — the one the old comment here described and deferred to worthless-11ix —
  # is now CLOSED: check_grype_ignore_expiry rejects a rule with no package
  # scope, and rejects a `type`-only scope that carries no `version`.
  #
  # WHAT THE SCOPE ACTUALLY BOUNDS, stated precisely, because the two gates
  # read it differently:
  #   - grype honours `version`. MEASURED by contrast (grype 0.114.0, this
  #     image): the rule at 14.2.0-19 suppresses 3 of 3 matches; at 99.9.9-99
  #     it suppresses 0 of 3. So the blocking image scan stops suppressing the
  #     day Debian bumps the package — the waiver cannot outlive the fix.
  #   - check_grype_unmapped_findings compares name and type and honours
  #     `version` as well (added alongside this entry); without that it read
  #     the scope as "any deb" and the pin bought nothing on the gate that
  #     actually blocks.
  # Residual breadth, stated without flattering it: `type: deb` at that exact
  # version covers ANY Debian package whose version string is 14.2.0-19. Not
  # "any package built from gcc-14" — covers() compares type and version and
  # enforces no provenance whatsoever, so a wholly unrelated deb that happened
  # to carry that version string would match. In this image only the three
  # reported gcc-14 binaries do, and a future gcc-14-sourced addition
  # (libgomp1 via numpy, say) would be silently covered for these two CVE ids.
  # Narrower than a name would be is not available here; narrower than
  # "everything" it certainly is.
  #
  # To close: drop this when Debian ships a fixed gcc, or when the base image
  # stops shipping the gcc runtime at all.
  - vulnerability: CVE-2026-102010
    package:
      type: deb
      version: 14.2.0-19
    reason: "Use-after-free in libstdc++ erase_if on a binary heap priority queue; hits gcc-14-base, libgcc-s1 and libstdc++6. Debian has no fix in any release (gcc-12/14/15/16 all vulnerable, unfixed — tracker read 2026-10-05), so there is nowhere to upgrade. Measured 2026-10-05 on the built image: 11 compiled extensions, none linking libstdc++, and the interpreter does not link it either. Base-image gcc runtime only; no Worthless code path reaches a C++ priority queue. Tracking worthless-11ix. SCOPE: pinned to `type: deb` at version 14.2.0-19 rather than by package name, because `libstdc++6` contains a `+` that grype treats as a regex and this repo's expiry hook rejects. Measured by contrast that grype honours the version: the rule at 14.2.0-19 suppressed 3 of 3 matches, at 99.9.9-99 it suppressed 0 of 3. Both gates honour the version: grype by its own matching, and check_grype_unmapped_findings because `version` is carried into the scope and compared there too — without that the pin bound nothing on the gate that actually blocks, since the grype step runs only-fixed and never sees a not-fixed finding. Residual breadth: this still covers any Debian package at exactly 14.2.0-19, which today is only the three gcc-14 binaries reported, but would silently cover a future gcc-14-sourced addition."
    expiry: "2027-01-27"

  # Second advisory, same libstdc++, same measurement. An integer overflow in
  # the aligned `operator new`: a large enough request wraps and under-allocates,
  # so the caller writes past the block. `operator new` is the C++ allocation
  # operator — only C++ code calls it, and nothing here is C++. Debian is again
  # unfixed across gcc-12/14/15/16 (tracker read 2026-10-05).
  #
  # RE-MEASURED 2026-10-05 on the REPINNED image (Python 3.13.16), not carried
  # over from the entry above: 11 compiled extensions, 0 linking libstdc++,
  # interpreter 0. RE-MEASURED again 2026-10-30 on Python 3.13.18 (#750),
  # amd64 and arm64, with `ldd` over every site-packages .so and the
  # interpreter: same result, and gcc-14-base, libgcc-s1 and libstdc++6 are
  # still at 14.2.0-19.
  - vulnerability: CVE-2026-95619
    package:
      type: deb
      version: 14.2.0-19
    reason: "Integer overflow in libstdc++'s aligned operator new: a large request wraps to an undersized allocation, so the caller writes past the block. Hits gcc-14-base, libgcc-s1 and libstdc++6. Debian has no fix in any release (gcc-12/14/15/16 all vulnerable, unfixed — tracker read 2026-10-05). Re-measured 2026-10-05 inside the repinned image (Python 3.13.16) and again 2026-10-30 on Python 3.13.18 (amd64 and arm64): 11 compiled extensions, none linking libstdc++, and the interpreter does not link it either. operator new is the C++ allocation operator and no Worthless code is C++; the gcc runtime is present only because the base image ships it. Tracking worthless-11ix. SCOPE: pinned to `type: deb` at version 14.2.0-19 rather than by package name, because `libstdc++6` contains a `+` that grype treats as a regex and this repo's expiry hook rejects. Measured by contrast that grype honours the version: the rule at 14.2.0-19 suppressed 3 of 3 matches, at 99.9.9-99 it suppressed 0 of 3. Both gates honour the version: grype by its own matching, and check_grype_unmapped_findings because `version` is carried into the scope and compared there too — without that the pin bound nothing on the gate that actually blocks, since the grype step runs only-fixed and never sees a not-fixed finding. Residual breadth: this still covers any Debian package at exactly 14.2.0-19, which today is only the three gcc-14 binaries reported, but would silently cover a future gcc-14-sourced addition."
    expiry: "2027-01-27"

  # CVE-2026-82049 (CPython tarfile extraction filters) was suppressed here
  # and is now DELETED rather than extended. Repinning the base image to
  # Python 3.13.16 retired it: measured 2026-10-06 against the built image
  # with ignores disabled, the finding is absent entirely. This file's rule
  # is to delete a suppression once its finding is gone, not to leave it
  # sitting there silencing nothing. The reachability argument it carried
  # (nothing EXTRACTS archives; tarfile is imported via keyring ->
  # jaraco.context but jaraco.context.tarball has no callers) is preserved
  # in tests/test_archive_reachability.py, which still guards the three
  # older tarfile suppressions below (grype no longer matches them on the
  # shipped image; WOR-1096 decides whether they go). Its second block
  # (deleted 2026-10-30, #750) recorded why the image is not on 3.14, and
  # that still holds, for 3.15 too: 3.14's
  # pathlib swallows EACCES in Path.is_file(), so an unreadable credential
  # surface reports clean with no caveat (worthless-epnw), and the
  # Dockerfile copies the python3.13 site-packages path by name.


  # socket.getaddrinfo() truncates a host or port at a null byte, which can
  # slip an attacker-chosen address past an allowlist. Turned main's required
  # `scan` red on 2026-11-05 (first seen on 4b4da0cf).
  #
  # MEASURED 2026-11-06 (grype 0.114.0, DB of 2026-11-05) on main's image,
  # amd64: python 3.13.18 binary, Medium. Upstream, checked via the CPython
  # repo the same day: fixed on main by GH-160899 (2026-10-29); backports to
  # 3.14 (GH-160926) and 3.15 (GH-160925) merged 2026-11-06; the 3.13
  # backport GH-160974 is still OPEN, and no released 3.13.x carries it.
  #
  # RETIRING THIS ENTRY: grype's record is NVD's "< 3.16.0", so a fixed
  # 3.13.19 would STILL match (the CVE-2026-4360 trap, documented below).
  # At expiry, re-measure: delete when grype stops matching the shipped
  # image, or when the image's interpreter contains GH-160974 and the range
  # is shown to be stale. The version pin makes a base-image bump re-fire it.
  #
  # Reachability: every upstream call goes through httpx, which refuses a NUL
  # in the host or port before any lookup (httpx.InvalidURL). The proxy only
  # dials the stored or registered base_url plus a fixed path; no request
  # header, body or path reaches the host or port. Pinned by
  # tests/test_upstream_host_reachability.py and test_proxy.py's
  # test_request_input_never_steers_the_upstream_host.
  #
  # NOT covered: the CLI installed outside this image runs the user's own
  # Python, which is just as affected; this scan says nothing about it. And
  # whoever can edit .env, providers.toml or the DB already chooses where
  # the key goes, so a NUL there adds nothing.
  - vulnerability: CVE-2026-116566
    package:
      name: python
      version: 3.13.18
      type: binary
    reason: "getaddrinfo() null-byte truncation in CPython. Re-measured 2026-11-26 (grype 0.114.0, DB built 2026-11-26): still Medium, fixed only in 3.16.0, matched on python 3.13.18 in a fresh arm64 build of v0.3.18 and in ghcr worthless-proxy:0.3.18 amd64. python:3.13-slim-trixie pulled 2026-11-26 (digest 7249d558) is still 3.13.18, so there is no newer 3.13 base. The 3.13 backport GH-160974 is still OPEN (read 2026-11-26). NVD's '< 3.16.0' range will match even a fixed 3.13.x. Unreachable: httpx refuses a NUL in host/port before lookup, and host/port come only from the stored or registered base_url; tests/test_upstream_host_reachability.py and test_proxy.py's host-steering test pass on 2026-11-26. Tracking WOR-1108."
    expiry: "2027-01-12"  # re-measured 2026-11-26 (worthless-kpkkm); staggered, re-measure before extending.

  # RE-MEASURED 2026-11-26 (worthless-kpkkm), for this block and
  # CVE-2026-116566 above: grype 0.114.0 (DB built 2026-11-26) still matches all
  # four on python 3.13.18, Medium, fixed only in 3.16.0, both on a fresh arm64
  # build of v0.3.18 and on ghcr 0.3.18 amd64. python:3.13-slim-trixie pulled
  # that day is still 3.13.18. Expiries are staggered two per date, 2027-01-12
  # and 2027-01-19.
  #
  # ── CPython 3.13.18, grype database of 2026-11-18 (WOR-1157) ───────────
  # Three Mediums arrived with that database and fail the fixable-only gate
  # (--fail-on medium) on every PR. Same shape as CVE-2026-116566 above:
  # grype's record is NVD's "< 3.16.0", so it matches every 3.13.x, and
  # 3.13.18 is the newest 3.13 release (python:3.13-slim-trixie, read
  # 2026-11-18). There is nothing to bump to. Pinned to version 3.13.18 so a
  # base-image bump re-fires them for a fresh argument.
  #
  # Measured 2026-11-18 on images built from main (amd64 + arm64):
  #
  #   CVE-2026-124249  http.cookiejar: an already-expired Set-Cookie deletes a
  #                    stored cookie for another domain without asking the
  #                    policy. The code RUNS: the proxy forwards through one
  #                    shared httpx.AsyncClient (upstream.py), and httpx 0.28.1
  #                    calls extract_cookies() on every response. The harm does
  #                    not land: only a configured upstream can send that
  #                    response, it already receives the user's real key, and
  #                    Worthless authenticates to providers by header, never by
  #                    cookie. Losing another provider's cookie gives it
  #                    nothing it lacks. Whoever sets base_url already chooses
  #                    where the key goes (as for CVE-2026-116566).
  #   CVE-2026-115559  imaplib STARTTLS read-ahead buffer. Nothing imports
  #                    imaplib: no hit in src, deploy or site-packages.
  #   CVE-2026-115791  `python -m tarfile|zipfile|gzip` extracting into the cwd
  #                    can plant a module that runs on the next error. Only the
  #                    command-line tools are affected; nothing invokes them (no
  #                    hit in src, deploy, Dockerfile, entrypoint.sh or
  #                    site-packages). Running one needs a shell in the
  #                    container, which is already code execution.
  #
  # NOT covered: the CLI installed outside this image runs the user's own
  # Python, which this scan says nothing about.
  - vulnerability: CVE-2026-124249
    package:
      name: python
      version: 3.13.18
      type: binary
    reason: "http.cookiejar lets an expired Set-Cookie delete another domain's stored cookie. Re-measured 2026-11-26 (grype 0.114.0, DB built 2026-11-26): still Medium, fixed only in 3.16.0, matched on python 3.13.18 in a fresh arm64 build of v0.3.18 and in ghcr worthless-proxy:0.3.18 amd64. python:3.13-slim-trixie pulled 2026-11-26 (digest 7249d558) is still 3.13.18, so there is no newer 3.13 base. It runs in the proxy's shared httpx client (httpx 0.28.1 in the image, 2026-11-26), but only a configured upstream can send the response, and that upstream already receives the real key. src/worthless has zero cookie references (grep 2026-11-26), and Worthless authenticates to providers by header, so the deletion gains the upstream nothing. Added in WOR-1157; re-check owned by WOR-1098."
    expiry: "2027-01-12"  # re-measured 2026-11-26 (worthless-kpkkm); staggered, re-measure before extending.
  - vulnerability: CVE-2026-115559
    package:
      name: python
      version: 3.13.18
      type: binary
    reason: "imaplib STARTTLS keeps plaintext read-ahead bytes after the handshake. Re-measured 2026-11-26 (grype 0.114.0, DB built 2026-11-26): still Medium, fixed only in 3.16.0, matched on python 3.13.18 in a fresh arm64 build of v0.3.18 and in ghcr worthless-proxy:0.3.18 amd64. python:3.13-slim-trixie pulled 2026-11-26 (digest 7249d558) is still 3.13.18, so there is no newer 3.13 base. Nothing imports imaplib: zero hits in src, deploy, or the image's site-packages (grep 2026-11-26). Added in WOR-1157; re-check owned by WOR-1098."
    expiry: "2027-01-19"  # re-measured 2026-11-26 (worthless-kpkkm); staggered, re-measure before extending.
  - vulnerability: CVE-2026-115791
    package:
      name: python
      version: 3.13.18
      type: binary
    reason: "The tarfile/zipfile/gzip command-line tools can extract a module that shadows the stdlib and then run it. Re-measured 2026-11-26 (grype 0.114.0, DB built 2026-11-26): still Medium, fixed only in 3.16.0, matched on python 3.13.18 in a fresh arm64 build of v0.3.18 and in ghcr worthless-proxy:0.3.18 amd64. python:3.13-slim-trixie pulled 2026-11-26 (digest 7249d558) is still 3.13.18, so there is no newer 3.13 base. Nothing in src, deploy, the Dockerfile, entrypoint.sh or the image's site-packages runs `-m tarfile|zipfile|gzip` (grep 2026-11-26), and running one needs a shell in the container. Added in WOR-1157; re-check owned by WOR-1098."
    expiry: "2027-01-19"  # re-measured 2026-11-26 (worthless-kpkkm); staggered, re-measure before extending.

  # CVE-2026-82560 (perl Pod::Text, WOR-934): waiver REMOVED 2026-11-26
  # (worthless-kpkkm). Measured that day with grype 0.114.0, DB built 2026-11-26 06:22 UTC, ignore-free config, on an arm64 image
  # built locally 2026-11-26 from 93b602c4 (v0.3.18) and on ghcr worthless-proxy:0.3.18 amd64:
  # grype still matches perl-base 5.40.1-6+deb13u1 (High), but Debian's state
  # is now `wont-fix`, not `not-fixed`. Neither gate fails on `wont-fix`. The
  # fixed-only scan drops it, and check_grype_unmapped_findings gates only
  # unknown and not-fixed. So the waiver suppressed nothing. If Debian moves it
  # back to not-fixed, the unmapped gate fails, and the waiver must be argued
  # again. The module is still absent: on 2026-11-26 the image has perl-base
  # only (no perl-modules-5.40), `find / -name Text.pm -path '*Pod*'` is empty,
  # and perldoc and pod2text do not exist.

  # ── CPython tarfile, base-image only (WOR-852 Track B) ──────────────
  # All three are tarfile bugs in the digest-pinned python:3.13-slim-bookworm
  # base. For CVE-2026-11940 and CVE-2026-11972, grype's only fixed version is
  # 3.15.0b4 — a PRE-RELEASE.
  #
  # RE-MEASURED 2026-08-02 (grype 0.114.0), five candidate bases pulled fresh:
  #   python:3.13-slim-bookworm  3.13.14  both present
  #   python:3.13-slim-trixie    3.13.14  both present
  #   python:3.13-slim           3.13.14  both present
  #   python:3.14-slim-trixie    3.14.6   both present
  #   python:3.14-slim           3.14.6   both present
  # Even a full major version ahead still carries both. Only 3.15-rc scans
  # clean, and shipping a release-candidate interpreter is the worse trade.
  #
  # CVE-2026-4360 is the OPPOSITE case, and the shortest-lived of the three.
  # Grype reports `fix: []` with an empty state for it — but that is a fact
  # about grype's record, not about CPython. Its record here is NVD-sourced
  # (`provider: nvd`), and NVD carries no fixed-version mapping, so grype has
  # nothing to report. Read as "no fix exists" it is simply wrong.
  #
  # NOTE ON METHOD: the five-base grype sweep above deliberately does NOT cover
  # CVE-2026-4360. It cannot — grype's record for this one is version-blind, so
  # scanning more images would return the same empty answer regardless of what
  # each image contains. Upstream containment was checked at the git level
  # instead, which is the only method that can answer the question:
  #
  # MEASURED 2026-08-05 against the CPython repo, not inferred:
  #   GH-151988 (gh-151987) is merged and backported to every live branch:
  #   3.10, 3.11, 3.12 (GH-152611, merged 2026-08-04), 3.13, 3.14 and 3.15.
  #   `git`-level containment via the GitHub compare API:
  #     v3.13.14 -> does NOT contain it   (our base image: still affected)
  #     v3.13.15 -> CONTAINS it           (tagged upstream)
  #     v3.14.6  -> does NOT contain it
  #     v3.14.7  -> CONTAINS it           (tagged upstream)
  # So a fixed CPython is released. What is missing is a published image:
  #   python:3.13.15-slim-bookworm  not on Docker Hub as of 2026-08-05
  #   python:3.13-slim-bookworm     still resolves to 3.13.14
  #   python:3.14.7-slim-bookworm   published, and it carries the fix
  #
  # DO NOT expect a base-image bump to retire this entry. MEASURED 2026-08-06,
  # from grype's own match record for CVE-2026-4360:
  #
  #     found.versionConstraint: "none (unknown)"
  #     found.cpes: ["cpe:2.3:a:python:python:*:*:*:*:*:*:*:*"]
  #
  #   The package CPE grype searches WITH is version-pinned (3.13.14); the
  #   record it matches AGAINST is the wildcard above, with no version range.
  #   So the rule fires on every version. Confirmed by scanning
  #   python:3.14.7-slim-bookworm — an interpreter that DOES contain the fix
  #   per the containment check above — which still reports CVE-2026-4360.
  #
  # Bumping the base therefore removes the vulnerability without silencing the
  # finding. Only NVD publishing version data (or grype changing provider for
  # this CVE) retires the entry. Bump, delete this, expect green, get red.
  #
  # Not reachable in Worthless. MEASURED 2026-08-07 INSIDE THE SHIPPED IMAGE,
  # by running the real container (`python /deploy/start.py`), serving real
  # HTTP traffic, and instrumenting both imports and calls:
  #
  #   - src/worthless: zero imports of tarfile / zipfile, zero
  #     shutil.unpack_archive. Enforced every CI run by
  #     tests/test_archive_reachability.py — not a one-off observation.
  #
  #   - stdlib tarfile IS IMPORTED at runtime, by jaraco.context (via keyring).
  #     An earlier version of this comment said otherwise, on two counts, both
  #     wrong because they were measured on a dev laptop instead of the image:
  #       * it claimed pygments was the only dep touching tarfile and was not
  #         loaded. pygments IS loaded, via httpx._main.
  #       * it claimed `backports.tarfile` was the resident one, so the CPython
  #         module was untouched. It is not. jaraco/context/__init__.py:26-29
  #         is a VERSION GATE, not an ImportError fallback:
  #             if TYPE_CHECKING or sys.version_info >= (3, 12):
  #                 import tarfile
  #             else:
  #                 from backports import tarfile
  #         This image runs 3.13.14, so the stdlib branch is the PRIMARY one and
  #         is taken whether or not backports is installed. (It is not installed
  #         here, but that is incidental — installing it would NOT end stdlib
  #         residency.) The vulnerable stdlib module is resident.
  #
  #   - tarfile is NEVER CALLED. With tarfile.open, TarFile.extract and
  #     TarFile.extractall wrapped, container startup plus live HTTP requests
  #     produced ZERO calls. Control: the same instrumentation fires
  #     immediately on a deliberate tarfile.open, so the null result is a real
  #     measurement and not a dead probe.
  #     COVERAGE, stated precisely: only /healthz and / reached a handler.
  #     /v1/messages and every other route tried (/v1/models, /docs, /metrics,
  #     /openapi.json) returned 401 at the auth boundary, so NO forwarding or
  #     response-decoding code ran. The authenticated proxy path has NOT been
  #     exercised under this instrumentation. What carries that gap is the
  #     first-party static guard, which proves no src/worthless module imports
  #     tarfile on ANY path, authenticated or not.
  #
  # That is the honest shape of this argument. The module being loaded is not
  # the risk; all three CVEs require CALLING into tarfile with an
  # attacker-supplied archive. Nothing here does, and no code path carries
  # attacker bytes toward one. "Imported but never called" is what holds — not
  # "never loaded", which was the previous claim and was simply false.
  #
  # The ignore stays scoped to `package: {name: python, type: binary}`, so it
  # cannot mask a finding filed against backports-tarfile or any other package.
  #
  # Linear: WOR-852 — move off EOL Debian 12, or re-check whether a stable
  # 3.13.x / 3.14.x backport has shipped. Re-MEASURE before extending; do not
  # extend blind.
