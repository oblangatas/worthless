# Grype configuration — read by anchore/scan-action when present at repo root.
#
# Ignores are time-boxed. Each entry MUST carry:
#   - vulnerability ID
#   - reason citing the upstream status
#   - linear ticket for the bump/recheck obligation
#   - expiry date (ISO YYYY-MM-DD)
#
# IMPORTANT — Grype does NOT honour `expiry`. Its IgnoreRule schema drops
# unknown keys silently, so an entry dated 2020 still suppresses its finding
# today (measured against grype 0.114.0 on 2026-08-01: a five-year-old expiry
# changed nothing, exit stayed 0). An earlier version of this header claimed
# Grype auto-re-fires past the date. It does not.
#
# The expiry is enforced by scripts/hooks/check_grype_ignore_expiry.py, wired
# into pre-commit as "supply chain: grype ignores are dated and current".
# That hook is the ONLY thing stopping a suppression from living forever.

ignore:
  - vulnerability: CVE-2026-15308
    package:
      name: python
      type: binary
    # RE-MEASURED 2026-08-02 (grype 0.114.0), five candidate bases pulled fresh.
    # There is still nowhere to upgrade to — not even a major version ahead:
    #
    #   python:3.13-slim-bookworm  3.13.14  present
    #   python:3.13-slim-trixie    3.13.14  present
    #   python:3.13-slim           3.13.14  present
    #   python:3.14-slim-trixie    3.14.6   present
    #   python:3.14-slim           3.14.6   present
    #
    # Grype's only fixed version remains 3.15.0 — a PRE-RELEASE. Shipping a
    # release-candidate interpreter to users is the worse trade against a CVE
    # whose attack surface here is bounded: non-root, network-isolated, and no
    # untrusted input parsed at the Python boundary.
    #
    # Supersedes the prior CVE-2026-7210 ignore: that one affected 3.13.13 and
    # is fixed in the current 3.13.14 base (grype no longer reports it).
    #
    # Linear: WOR-691 — bump the Docker base image when a stable 3.13.x or
    # 3.14.x backport ships, then DELETE this entry rather than extending it.
    reason: "Upstream fix only in Python 3.15.0 (pre-release). Re-measured 2026-08-02 across 3.13/3.14 slim bookworm+trixie: all still affected. Tracking WOR-691."
    expiry: "2027-01-31"  # extended on a fresh measurement, not blind. Re-measure before extending again.

  # ── CPython tarfile, base-image only (WOR-852 Track B) ──────────────
  # Both are tarfile bugs in the digest-pinned python:3.13-slim-bookworm base.
  # Grype's only fixed version is 3.15.0b4 — a PRE-RELEASE.
  #
  # RE-MEASURED 2026-08-02 (grype 0.114.0), five candidate bases pulled fresh:
  #   python:3.13-slim-bookworm  3.13.14  both present
  #   python:3.13-slim-trixie    3.13.14  both present
  #   python:3.13-slim           3.13.14  both present
  #   python:3.14-slim-trixie    3.14.6   both present
  #   python:3.14-slim           3.14.6   both present
  # Even a full major version ahead still carries both. Only 3.15-rc scans
  # clean, and shipping a release-candidate interpreter is the worse trade.
  #
  # Not reachable in Worthless. Verified 2026-08-01, first-party AND deps:
  #   - src/worthless: zero imports of tarfile, zero shutil.unpack_archive,
  #     zero zipfile. The proxy forwards JSON and never opens an archive.
  #   - site-packages: the only runtime dependency touching tarfile is
  #     pygments, in lexers/_php_builtins.py — a maintenance script for
  #     regenerating lexer data. Confirmed NOT loaded after importing
  #     worthless.proxy + worthless.cli.
  #   - `backports.tarfile` IS resident at runtime (keyring -> jaraco-context).
  #     It is a separate PyPI package, not the CPython stdlib module these two
  #     CVEs are filed against, and this ignore is scoped to
  #     `package: {name: python, type: binary}` so it does not mask anything
  #     filed against backports-tarfile itself. Worthless never calls the
  #     jaraco.context tarball helper that would exercise it.
  # Both CVEs require calling into tarfile with an attacker-supplied archive,
  # and no code path carries attacker bytes to any of the above.
  #
  # Linear: WOR-852 — move off EOL Debian 12, or re-check whether a stable
  # 3.13.x / 3.14.x backport has shipped. Re-MEASURE before extending; do not
  # extend blind.
  - vulnerability: CVE-2026-11940
    package:
      name: python
      type: binary
    # tarfile.extractall() 'data'/'tar' filter bypass via a crafted archive
    # where a hardlink references a symlink stored at a deeper name.
    reason: "CPython tarfile; fix only in 3.15.0b4 (pre-release). Unreachable — no tarfile/archive use in src/worthless. Tracking WOR-852."
    expiry: "2027-01-31"  # extended 2026-08-02 on the re-measurement above, not blind.

  - vulnerability: CVE-2026-11972
    package:
      name: python
      type: binary
    # tarfile streaming mode (mode="r|") mishandles EOF, making archive
    # parsing take exponentially longer — a DoS against archive parsing.
    reason: "CPython tarfile; fix only in 3.15.0b4 (pre-release). Unreachable — no tarfile/archive use in src/worthless. Tracking WOR-852."
    expiry: "2027-01-31"  # extended 2026-08-02 on the re-measurement above, not blind.

  # ── CPython Mediums, base-image only (WOR-852 Track C) ──────────────
  # These four became gating when the scan cutoff moved from `high` to
  # `medium` (see .github/workflows/docker-security.yml). Before that they
  # were invisible: below the cutoff, and the scan's SARIF output is written
  # to a temp file the runner deletes, so nothing ever surfaced them. The
  # cutoff moved so that a FIFTH Medium fails the build instead of vanishing;
  # these four are the measured, named exceptions.
  #
  # All four are fixed only in Python 3.15 PRE-RELEASES (a6/b3/b4). Same trade
  # WOR-852 already rejected for the two Highs above: shipping a pre-release
  # interpreter is worse than carrying a bounded, argued finding.
  #
  # MEASURED 2026-08-03 (grype 0.114.0) across every candidate base, with a
  # 3.15 pre-release as the positive control — these four were NOT given the
  # Highs' expiry on the strength of the Highs' measurement:
  #
  #   python:3.13-slim-bookworm  3.13.14  all four present   <- ours
  #   python:3.13-slim-trixie    3.13.14  all four present
  #   python:3.13-slim           3.13.14  all four present
  #   python:3.14-slim-trixie    3.14.6   all four present
  #   python:3.14-slim           3.14.6   all four present
  #   python:3.15-rc-slim        3.15.0   ALL FOUR CLEAR     <- control
  #
  # A full major version ahead still carries all four. The control confirms
  # the fix is real and pre-release-only, so there is no stable base to move
  # to — the same trap as the Highs, now demonstrated rather than assumed.
  #
  # Reachability MEASURED 2026-08-02 against the built image, not assumed —
  # first-party imports AND runtime-resident modules after importing
  # worthless.proxy + worthless.cli. Re-MEASURE before extending.
  - vulnerability: CVE-2025-15366
    package:
      name: python
      type: binary
    # imaplib: a user-controlled command can inject extra IMAP commands via
    # newlines. Measured: zero `import imaplib` in src/worthless, and imaplib
    # is NOT resident after importing worthless.proxy + worthless.cli.
    # Worthless speaks HTTP to LLM providers; it has no mail client.
    reason: "CPython imaplib injection; fix only in 3.15.0a6 (pre-release). Unreachable — imaplib not imported first-party and not resident at runtime. Tracking WOR-852."
    expiry: "2027-01-31"  # set 2026-08-03 on the six-base measurement above, not blind.

  - vulnerability: CVE-2025-15367
    package:
      name: python
      type: binary
    # poplib: same newline-injection shape as CVE-2025-15366, POP3 instead of
    # IMAP. Measured identically: not imported first-party, not resident.
    reason: "CPython poplib injection; fix only in 3.15.0a6 (pre-release). Unreachable — poplib not imported first-party and not resident at runtime. Tracking WOR-852."
    expiry: "2027-01-31"  # set 2026-08-03 on the six-base measurement above, not blind.

  - vulnerability: CVE-2026-12003
    package:
      name: python
      type: binary
    # VPATH landmark discovery: a Python that finds Modules/setup.local at a
    # VPATH-relative path assumes it is running from a source tree and builds
    # a different default sys.path. The image's interpreter is an INSTALLED
    # layout, measured in-container: sys.prefix=/usr/local,
    # sys.executable=/usr/local/bin/python, and Modules/setup.local absent.
    # Planting that landmark needs write access beside the interpreter, which
    # the non-root runtime user does not have.
    reason: "CPython VPATH sys.path; fix only in 3.15.0b3 (pre-release). Unreachable — installed layout, no Modules/setup.local, non-root runtime. Tracking WOR-852."
    expiry: "2027-01-31"  # set 2026-08-03 on the six-base measurement above, not blind.

  - vulnerability: CVE-2026-0864
    package:
      name: python
      type: binary
    # configparser: WRITING a config whose multi-line value carries \r can
    # inject extra keys. This is the only one of the four that is resident at
    # runtime, so "we don't use it" was not available as an answer and the
    # whole image had to be swept (2026-08-03). Five packages import
    # configparser; exactly one WRITES with it:
    #
    #   pip (+ vendored distlib)  reads AND WRITES  not resident at runtime
    #   keyring                   reads keyringrc   resident  (core.py:7/171)
    #   rich                      reads a theme     resident
    #   uvicorn                   reads log config  resident
    #   pydantic                  mypy plugin only  not resident
    #
    # typer and starlette look like writers to a naive grep and are not:
    # typer's hits are docstring examples, starlette's `parser.write()` is a
    # multipart form parser unrelated to configparser.
    #
    # So the only writer in the image is pip, which is not loaded by the proxy
    # or the CLI. src/worthless imports configparser nowhere. The CVE needs a
    # write path to inject into; there isn't one.
    reason: "CPython configparser write-injection; fix only in 3.15.0b4 (pre-release). Unreachable — swept whole image 2026-08-03: only pip writes via configparser and it is not resident. Tracking WOR-852."
    expiry: "2027-01-31"  # set 2026-08-03 on the six-base measurement above, not blind.
