# Grype configuration — read by anchore/scan-action when present at repo root.
#
# Ignores are time-boxed. Each entry MUST carry:
#   - vulnerability ID
#   - reason citing the upstream status
#   - linear ticket for the bump/recheck obligation
#   - expiry date (ISO YYYY-MM-DD)
#
# IMPORTANT — Grype does NOT honour `expiry`. Its IgnoreRule schema drops
# unknown keys silently, so an entry dated 2020 still suppresses its finding
# today (measured against grype 0.114.0 on 2026-08-01: a five-year-old expiry
# changed nothing, exit stayed 0). An earlier version of this header claimed
# Grype auto-re-fires past the date. It does not.
#
# The expiry is enforced by scripts/hooks/check_grype_ignore_expiry.py, wired
# into pre-commit as "supply chain: grype ignores are dated and current".
# That hook is the ONLY thing stopping a suppression from living forever.
#
# ARCHITECTURE: every reachability argument below was measured on **amd64**.
# These rules match on `package.name` + `type` with no version pin, so they
# apply to the arm64 image too — but the evidence behind them does not. arm64
# was scanned once (2026-08-06) and carried the identical findings; nothing
# keeps that true. WOR-873 added a weekly arm64 scan so divergence surfaces on
# a Monday rather than at a release tag. Re-MEASURE per-arch before extending.

ignore:
  - vulnerability: CVE-2026-85091
    package:
      name: zlib1g
      type: deb
    # High, fix=not-fixed. Debian's tracker lists zlib as vulnerable in
    # bookworm, trixie AND forky/sid — "(unstable) (unfixed)", Debian bug
    # 1146895. There is nowhere to upgrade to, so this survives the Debian 13
    # move (worthless-tw1g) rather than being solved by it.
    #
    # The flaw is a heap overflow in gz_vacate(), reachable only by calling
    # gzprintf()/gzvprintf() after a non-blocking gzwrite() stall. That is
    # zlib's gzip FILE api — NOT the deflate/inflate stream api that HTTP
    # content-encoding uses, which is what a proxy actually exercises.
    #
    # MEASURED 2026-09-08 inside the built trixie image, not inferred:
    #   - swept every executable and shared object: 951 files scanned,
    #     0 referencing `gzprintf` or `gzvprintf`
    #   - CPython's zlib module exposes no gz* API at all (compress/
    #     decompress/compressobj/decompressobj only); Python's gzip module
    #     is built on decompressobj, never zlib's gz file api
    #   - zlib runtime 1.3.1
    # So the vulnerable entry points are not reachable from anything shipped
    # in this image.
    #
    # LIMIT: measured on arm64 (Apple Silicon build). The weekly arm64/amd64
    # scans are what would surface divergence. Re-measure before extending.
    reason: "zlib gz_vacate() overflow reachable only via gzprintf/gzvprintf; 951 binaries in the image reference neither, and CPython's zlib exposes no gz* API. Unfixed in every Debian release including sid (bug 1146895). Tracking worthless-tw1g."
    expiry: "2026-12-08"

  - vulnerability: CVE-2026-15308
    package:
      name: python
      type: binary
    # RE-MEASURED 2026-08-02 (grype 0.114.0), five candidate bases pulled fresh.
    # There is still nowhere to upgrade to — not even a major version ahead:
    #
    #   python:3.13-slim-bookworm  3.13.14  present
    #   python:3.13-slim-trixie    3.13.14  present
    #   python:3.13-slim           3.13.14  present
    #   python:3.14-slim-trixie    3.14.6   present
    #   python:3.14-slim           3.14.6   present
    #
    # Grype's only fixed version remains 3.15.0 — a PRE-RELEASE. Shipping a
    # release-candidate interpreter to users is the worse trade against a CVE
    # whose attack surface here is bounded: non-root, network-isolated, and no
    # untrusted input parsed at the Python boundary.
    #
    # Supersedes the prior CVE-2026-7210 ignore: that one affected 3.13.13 and
    # is fixed in the current 3.13.14 base (grype no longer reports it).
    #
    # Linear: WOR-691 — bump the Docker base image when a stable 3.13.x or
    # 3.14.x backport ships, then DELETE this entry rather than extending it.
    reason: "Upstream fix only in Python 3.15.0 (pre-release). Re-measured 2026-08-02 across 3.13/3.14 slim bookworm+trixie: all still affected. Tracking WOR-691."
    expiry: "2027-01-31"  # extended on a fresh measurement, not blind. Re-measure before extending again.

  # ── CPython, base-image only (worthless-kzfq) ───────────────────────
  # Both arrived with the grype DB refresh of 2026-09-10 and turned every open
  # PR red without a line of code changing — the same failure mode as the sharp
  # advisory this branch also fixes. Unlike that one, here the fix really is
  # unreachable, and this is the measurement rather than the assumption.
  #
  # MEASURED 2026-09-10 (grype 0.114.0), bases pulled fresh from the registry:
  #
  #   python:3.13-slim-trixie  3.13.15  BOTH present   <- the base this image uses
  #   python:3.14-slim-trixie  3.14.7   BOTH present   <- a full minor ahead
  #
  # Grype's only fixed version for both is 3.15.0rc2 — a RELEASE CANDIDATE.
  # Shipping an RC interpreter to users is the worse trade, the same call the
  # CVE-2026-15308 entry above already made and re-measured.
  #
  # NOT parked on the bulk 2027-01-31 date that 21 other entries share. That
  # clustering is how dated waivers quietly become permanent; these two get
  # their own date so they are re-argued on their own evidence.
  #
  # To close: when CPython backports to a stable 3.13.x or 3.14.x, bump the
  # base and DELETE these entries rather than extending them.
  - vulnerability: CVE-2026-17084
    package:
      name: python
      type: binary
    reason: "Upstream fix only in Python 3.15.0rc2 (pre-release). Measured 2026-09-10: python:3.13-slim-trixie 3.13.15 and python:3.14-slim-trixie 3.14.7 are both still affected, so there is nowhere stable to upgrade to. Base-image interpreter only. Tracking worthless-kzfq."
    expiry: "2026-12-08"

  # ── tempfile.TemporaryDirectory cleanup race (worthless-11ix) ───────
  # A race in TemporaryDirectory's cleanup: an attacker who can modify the
  # tree mid-cleanup swaps a directory for a symlink, so files OUTSIDE the
  # temp dir get deleted, or their permissions and flags reset.
  #
  # Grype lists the fix as 3.15.0. That is not a stable release, and the
  # advisory records no 3.13 backport, so there is nowhere to upgrade — the
  # base image already runs 3.13.16, the newest 3.13 there is.
  #
  # MEASURED 2026-10-05 against the built image, not asserted:
  #   1. `tempfile.TemporaryDirectory` — the vulnerable class — appears
  #      ZERO times in src/. Worthless uses mkdtemp and mkstemp, which have
  #      no auto-cleanup and so never reach the racing finalizer.
  #   2. We do call shutil.rmtree on mkdtemp dirs (openclaw/skill.py,
  #      cli/sidecar_lifecycle.py), which is the same underlying path the
  #      advisory names. In this image that path is the SAFE one:
  #      shutil.rmtree.avoids_symlink_attacks is True on Linux 3.13.16,
  #      read from inside the container. The advisory's own caveat applies
  #      only where that flag is False.
  #   3. The residual on all platforms is file-flag reset, a BSD/macOS
  #      chflags concern that does not exist on this Linux image.
  #
  # The attacker also needs concurrent write access inside the container's
  # temp tree — they are already executing there.
  #
  # To close: drop this when CPython backports to 3.13.x, or when 3.15 is
  # stable and worthless-jsx6 moves the base image.
  - vulnerability: CVE-2026-12345
    package: {name: python, type: binary}
    reason: "Race in tempfile.TemporaryDirectory cleanup: a directory swapped for a symlink mid-cleanup deletes or re-permissions files outside the temp tree. Fix listed as 3.15.0, which is not stable, and no 3.13 backport exists — the image already runs 3.13.16, the newest 3.13. Measured 2026-10-05 on the built image: TemporaryDirectory appears zero times in src/ (worthless uses mkdtemp/mkstemp, which have no auto-cleanup finalizer), and where we do call shutil.rmtree on those dirs, shutil.rmtree.avoids_symlink_attacks reads True inside the container, which is the condition the advisory says removes the deletion attack. Remaining file-flag reset is a BSD/macOS chflags concern, absent on Linux. Tracking worthless-11ix."
    expiry: "2026-12-31"

  # ── libstdc++ erase_if, nothing here links it (worthless-11ix) ──────
  # A use-after-free in libstdc++: erase_if on a binary heap priority queue
  # reallocates storage without updating the internal entry pointer. Debian
  # has no fix in ANY release — gcc-12, 14, 15 and 16 are all marked
  # vulnerable, unfixed, on the security tracker (read 2026-10-05), so
  # fix=not-fixed is the real upstream state, not a stale grype record.
  #
  # MEASURED 2026-10-05, not assumed. Installed requirements.txt into
  # python:3.13-slim-trixie (amd64, Python 3.13.15) and read every compiled
  # extension's dynamic section:
  #   44 packages, 11 .so files, 0 linking libstdc++
  # The interpreter does not link it either. libstdc++ is present only
  # because the base image ships the gcc runtime; no Worthless code path
  # reaches a C++ priority queue, so erase_if is never called.
  #
  # SCOPED BY TYPE + VERSION, not by name, and the expiry hook is why. It
  # rejects any package name holding a regex activator, because grype turns
  # such a name into a full-match regex and the ignore then silences packages
  # it never named. `libstdc++6` carries two `+`, and escaping them adds `\` —
  # also an activator — so there is no spelling of that name the hook accepts.
  #
  # An earlier revision of these two entries therefore carried NO `package`
  # key at all, and said so, calling the cost "tolerable". It was not: an empty
  # scope USED TO make check_grype_unmapped_findings return True for the CVE id
  # on EVERY package in every ecosystem, including a future first-party one
  # nobody measured. It now matches nothing instead. That gap
  # — the one the old comment here described and deferred to worthless-11ix —
  # is now CLOSED: check_grype_ignore_expiry rejects a rule with no package
  # scope, and rejects a `type`-only scope that carries no `version`.
  #
  # WHAT THE SCOPE ACTUALLY BOUNDS, stated precisely, because the two gates
  # read it differently:
  #   - grype honours `version`. MEASURED by contrast (grype 0.114.0, this
  #     image): the rule at 14.2.0-19 suppresses 3 of 3 matches; at 99.9.9-99
  #     it suppresses 0 of 3. So the blocking image scan stops suppressing the
  #     day Debian bumps the package — the waiver cannot outlive the fix.
  #   - check_grype_unmapped_findings compares name and type and honours
  #     `version` as well (added alongside this entry); without that it read
  #     the scope as "any deb" and the pin bought nothing on the gate that
  #     actually blocks.
  # Residual breadth: `type: deb` at that exact version covers any Debian
  # package built from gcc-14 at 14.2.0-19 — today exactly the three reported
  # ones, but a future gcc-14-sourced addition (libgomp1 via numpy, say) would
  # be silently covered for these two CVE ids. Narrower than a name would be
  # is not available here; narrower than "everything" it certainly is.
  #
  # To close: drop this when Debian ships a fixed gcc, or when the base image
  # stops shipping the gcc runtime at all.
  - vulnerability: CVE-2026-102010
    package:
      type: deb
      version: 14.2.0-19
    reason: "Use-after-free in libstdc++ erase_if on a binary heap priority queue; hits gcc-14-base, libgcc-s1 and libstdc++6. Debian has no fix in any release (gcc-12/14/15/16 all vulnerable, unfixed — tracker read 2026-10-05), so there is nowhere to upgrade. Measured 2026-10-05 on the built image: 11 compiled extensions, none linking libstdc++, and the interpreter does not link it either. Base-image gcc runtime only; no Worthless code path reaches a C++ priority queue. Tracking worthless-11ix. SCOPE: pinned to `type: deb` at version 14.2.0-19 rather than by package name, because `libstdc++6` contains a `+` that grype treats as a regex and this repo's expiry hook rejects. Measured by contrast that grype honours the version: the rule at 14.2.0-19 suppressed 3 of 3 matches, at 99.9.9-99 it suppressed 0 of 3. Both gates honour the version: grype by its own matching, and check_grype_unmapped_findings because `version` is carried into the scope and compared there too — without that the pin bound nothing on the gate that actually blocks, since the grype step runs only-fixed and never sees a not-fixed finding. Residual breadth: this still covers any Debian package at exactly 14.2.0-19, which today is only the three gcc-14 binaries reported, but would silently cover a future gcc-14-sourced addition."
    expiry: "2027-01-31"

  # Second advisory, same libstdc++, same measurement. An integer overflow in
  # the aligned `operator new`: a large enough request wraps and under-allocates,
  # so the caller writes past the block. `operator new` is the C++ allocation
  # operator — only C++ code calls it, and nothing here is C++. Debian is again
  # unfixed across gcc-12/14/15/16 (tracker read 2026-10-05).
  #
  # RE-MEASURED 2026-10-05 on the REPINNED image (Python 3.13.16), not carried
  # over from the entry above: 11 compiled extensions, 0 linking libstdc++,
  # interpreter 0.
  - vulnerability: CVE-2026-95619
    package:
      type: deb
      version: 14.2.0-19
    reason: "Integer overflow in libstdc++'s aligned operator new: a large request wraps to an undersized allocation, so the caller writes past the block. Hits gcc-14-base, libgcc-s1 and libstdc++6. Debian has no fix in any release (gcc-12/14/15/16 all vulnerable, unfixed — tracker read 2026-10-05). Re-measured 2026-10-05 inside the repinned image (Python 3.13.16): 11 compiled extensions, none linking libstdc++, and the interpreter does not link it either. operator new is the C++ allocation operator and no Worthless code is C++; the gcc runtime is present only because the base image ships it. Tracking worthless-11ix. SCOPE: pinned to `type: deb` at version 14.2.0-19 rather than by package name, because `libstdc++6` contains a `+` that grype treats as a regex and this repo's expiry hook rejects. Measured by contrast that grype honours the version: the rule at 14.2.0-19 suppressed 3 of 3 matches, at 99.9.9-99 it suppressed 0 of 3. Both gates honour the version: grype by its own matching, and check_grype_unmapped_findings because `version` is carried into the scope and compared there too — without that the pin bound nothing on the gate that actually blocks, since the grype step runs only-fixed and never sees a not-fixed finding. Residual breadth: this still covers any Debian package at exactly 14.2.0-19, which today is only the three gcc-14 binaries reported, but would silently cover a future gcc-14-sourced addition."
    expiry: "2027-01-31"

  # CVE-2026-82049 (CPython tarfile extraction filters) was suppressed here
  # and is now DELETED rather than extended. Repinning the base image to
  # Python 3.13.16 retired it: measured 2026-10-06 against the built image
  # with ignores disabled, the finding is absent entirely. This file's rule
  # is to delete a suppression once its finding is gone, not to leave it
  # sitting there silencing nothing. The reachability argument it carried
  # (nothing EXTRACTS archives; tarfile is imported via keyring ->
  # jaraco.context but jaraco.context.tarball has no callers) is preserved
  # in tests/test_archive_reachability.py, which still guards the three
  # older tarfile CVEs below.


  - vulnerability: CVE-2026-15806
    package:
      name: python
      type: binary
    reason: "Upstream fix only in Python 3.15.0rc2 (pre-release). Measured 2026-09-10: python:3.13-slim-trixie 3.13.15 and python:3.14-slim-trixie 3.14.7 are both still affected, so there is nowhere stable to upgrade to. Base-image interpreter only. Tracking worthless-kzfq."
    expiry: "2026-12-08"

  # ── perl's POD formatter, base-image only (WOR-934) ─────────────────
  # Arrived with the grype DB refresh of 2026-09-2x and turned main red. It is
  # fix=not-fixed, so `only-fixed: true` drops it and the fixed-only gate never
  # sees it — check_grype_unmapped_findings.py is what caught it, which is the
  # job that hook exists to do.
  #
  # The flaw (MEASURED from grype's own record, 2026-09-27): Pod::Text before
  # 6.1.1 exhausts CPU and memory formatting a POD document whose `=over`
  # nesting drives the margin to the output width — the line-splitting
  # substitution then matches the empty string and the loop never consumes
  # input. Reaching it requires FORMATTING AN ATTACKER-SUPPLIED POD DOCUMENT.
  #
  # Reachability, MEASURED IN THE BUILT IMAGE 2026-09-27 — and the honest
  # answer is stronger than "we don't call it". The vulnerable module is NOT
  # PRESENT:
  #
  #   dpkg -l | grep "^ii  perl"    ->  perl-base only (no perl, no
  #                                     perl-modules-5.40)
  #   find / -name Text.pm -path '*Pod*'  ->  empty
  #   command -v perldoc / pod2text       ->  absent, both
  #
  # grype matched the perl-base VERSION, not vulnerable code on disk. Pod::Text
  # ships in perl-modules, which this image does not install. There is no
  # perldoc or pod2text to run even by hand after `docker exec`.
  #
  # An earlier version of this entry argued from `grep -rl perl` over our
  # entrypoint and deploy scripts. That was weaker AND rots: it says nothing
  # about the Python package, a future subprocess call, or the healthcheck.
  # File existence does not rot.
  #
  # Debian has no fixed version, so there is nothing to bump to — and nothing
  # to wait for either. Re-measure at expiry by re-running the three commands
  # above: this entry dies the day perl-modules appears in the image (then it
  # is really reachable and needs a fix), or the day grype stops matching
  # perl-base for it.
  - vulnerability: CVE-2026-82560
    package:
      name: perl-base
      type: deb
    reason: "Pod::Text <6.1.1 CPU/memory exhaustion when formatting an attacker-supplied POD document. THE MODULE IS NOT IN THE IMAGE: measured 2026-09-27, only perl-base is installed (no perl-modules-5.40), `find / -name Text.pm -path '*Pod*'` is empty, and perldoc/pod2text do not exist. Grype matched the perl-base version, not vulnerable code on disk. Debian fix=not-fixed, so there is nothing to upgrade to. Re-measure by re-running those commands; this dies when perl-modules appears. Tracking WOR-934."
    expiry: "2026-12-31"  # no fix exists; re-measure for a fixed perl-base, do not blind-extend.

  # ── CPython tarfile, base-image only — A FIX EXISTS (WOR-934) ───────
  # Read this one differently from every other entry in this file. The others
  # are waivers because there is nowhere to upgrade to. This one is a DELAY:
  # the fix is real, shipped, and stable, and we are not taking it yet.
  #
  # MEASURED 2026-09-26 (grype 0.118.0), bases pulled fresh:
  #
  #   python:3.13-slim-trixie  3.13.15  present   <- the base this image uses
  #   python:3.14-slim-trixie  3.14.7   ABSENT
  #   python:3.14-slim         3.14.7   ABSENT
  #
  # Why we are not on 3.14 today, measured the same day:
  #   1. The suite fails there. unshardable_credentials.py relies on
  #      Path.is_file() raising for EACCES to record a "could not be checked"
  #      caveat; 3.14's pathlib swallows it, so an unreadable credential
  #      surface reports CLEAN with no caveat — the false all-clear that
  #      module exists to prevent (1 failed / 1136 passed, worthless-epnw P1).
  #      Taking the fix today trades a CVE we do not call for a regression in
  #      a guarantee we advertise.
  #   2. The Dockerfile copies /usr/local/lib/python3.13/site-packages, so a
  #      3.14 image does not build until that path moves too.
  #
  # Reachability: worthless calls no tarfile/unpack_archive/extract API at all
  # (grep of src/ on 2026-09-26 is empty). This is the interpreter we ship
  # inside the image, not a path our code takes. That argument is a grep taken
  # on one day — it is not enforced by anything, so re-check it, do not
  # inherit it.
  #
  # THIRTY DAYS, not the bulk date. A fix exists; the clock should hurt.
  # WOR-934 (due 2026-10-27) carries the bump. DELETE this entry then.
  - vulnerability: CVE-2026-82049
    package:
      name: python
      type: binary
    reason: "DELAY, not a dead end: Python 3.14.7 IS fixed. Measured 2026-09-26 — python:3.13-slim-trixie 3.13.15 affected, python:3.14-slim-trixie and python:3.14-slim 3.14.7 both clean. Not taken yet because the suite fails on 3.14 (worthless-epnw: an unreadable credential surface is reported clean with no caveat) and the Dockerfile hardcodes the python3.13 site-packages path. Base-image interpreter only; worthless calls no tarfile API. Tracking WOR-934, due 2026-10-27."
    expiry: "2026-10-27"  # matches WOR-934's due date on purpose. Do not extend — fix it.

  # ── CPython tarfile, base-image only (WOR-852 Track B) ──────────────
  # All three are tarfile bugs in the digest-pinned python:3.13-slim-bookworm
  # base. For CVE-2026-11940 and CVE-2026-11972, grype's only fixed version is
  # 3.15.0b4 — a PRE-RELEASE.
  #
  # RE-MEASURED 2026-08-02 (grype 0.114.0), five candidate bases pulled fresh:
  #   python:3.13-slim-bookworm  3.13.14  both present
  #   python:3.13-slim-trixie    3.13.14  both present
  #   python:3.13-slim           3.13.14  both present
  #   python:3.14-slim-trixie    3.14.6   both present
  #   python:3.14-slim           3.14.6   both present
  # Even a full major version ahead still carries both. Only 3.15-rc scans
  # clean, and shipping a release-candidate interpreter is the worse trade.
  #
  # CVE-2026-4360 is the OPPOSITE case, and the shortest-lived of the three.
  # Grype reports `fix: []` with an empty state for it — but that is a fact
  # about grype's record, not about CPython. Its record here is NVD-sourced
  # (`provider: nvd`), and NVD carries no fixed-version mapping, so grype has
  # nothing to report. Read as "no fix exists" it is simply wrong.
  #
  # NOTE ON METHOD: the five-base grype sweep above deliberately does NOT cover
  # CVE-2026-4360. It cannot — grype's record for this one is version-blind, so
  # scanning more images would return the same empty answer regardless of what
  # each image contains. Upstream containment was checked at the git level
  # instead, which is the only method that can answer the question:
  #
  # MEASURED 2026-08-05 against the CPython repo, not inferred:
  #   GH-151988 (gh-151987) is merged and backported to every live branch:
  #   3.10, 3.11, 3.12 (GH-152611, merged 2026-08-04), 3.13, 3.14 and 3.15.
  #   `git`-level containment via the GitHub compare API:
  #     v3.13.14 -> does NOT contain it   (our base image: still affected)
  #     v3.13.15 -> CONTAINS it           (tagged upstream)
  #     v3.14.6  -> does NOT contain it
  #     v3.14.7  -> CONTAINS it           (tagged upstream)
  # So a fixed CPython is released. What is missing is a published image:
  #   python:3.13.15-slim-bookworm  not on Docker Hub as of 2026-08-05
  #   python:3.13-slim-bookworm     still resolves to 3.13.14
  #   python:3.14.7-slim-bookworm   published, and it carries the fix
  #
  # DO NOT expect a base-image bump to retire this entry. MEASURED 2026-08-06,
  # from grype's own match record for CVE-2026-4360:
  #
  #     found.versionConstraint: "none (unknown)"
  #     found.cpes: ["cpe:2.3:a:python:python:*:*:*:*:*:*:*:*"]
  #
  #   The package CPE grype searches WITH is version-pinned (3.13.14); the
  #   record it matches AGAINST is the wildcard above, with no version range.
  #   So the rule fires on every version. Confirmed by scanning
  #   python:3.14.7-slim-bookworm — an interpreter that DOES contain the fix
  #   per the containment check above — which still reports CVE-2026-4360.
  #
  # Bumping the base therefore removes the vulnerability without silencing the
  # finding. Only NVD publishing version data (or grype changing provider for
  # this CVE) retires the entry. Bump, delete this, expect green, get red.
  #
  # Not reachable in Worthless. MEASURED 2026-08-07 INSIDE THE SHIPPED IMAGE,
  # by running the real container (`python /deploy/start.py`), serving real
  # HTTP traffic, and instrumenting both imports and calls:
  #
  #   - src/worthless: zero imports of tarfile / zipfile, zero
  #     shutil.unpack_archive. Enforced every CI run by
  #     tests/test_archive_reachability.py — not a one-off observation.
  #
  #   - stdlib tarfile IS IMPORTED at runtime, by jaraco.context (via keyring).
  #     An earlier version of this comment said otherwise, on two counts, both
  #     wrong because they were measured on a dev laptop instead of the image:
  #       * it claimed pygments was the only dep touching tarfile and was not
  #         loaded. pygments IS loaded, via httpx._main.
  #       * it claimed `backports.tarfile` was the resident one, so the CPython
  #         module was untouched. It is not. jaraco/context/__init__.py:26-29
  #         is a VERSION GATE, not an ImportError fallback:
  #             if TYPE_CHECKING or sys.version_info >= (3, 12):
  #                 import tarfile
  #             else:
  #                 from backports import tarfile
  #         This image runs 3.13.14, so the stdlib branch is the PRIMARY one and
  #         is taken whether or not backports is installed. (It is not installed
