  # ── OpenSSL 3.5.9 (trixie), CVE-2026-107494 QUIC RETIRE_CONNECTION_ID (worthless-3g4u) ─
  # First in grype's database built 2026-11-26, as High. The flaw: the QUIC
  # stack queues a RETIRE_CONNECTION_ID
  # frame for every RETRANSMITTED NEW_CONNECTION_ID frame, with no cap, so a
  # malicious QUIC peer can grow memory until OOM. It completes the fix for
  # CVE-2026-84784. DoS only. OpenSSL rates it Low; grype's High is NVD's 7.5.
  #
  # SOURCE. OpenSSL advisory https://openssl-library.org/news/secadv/20261124.txt
  # (read 2026-11-26): Severity Low; 4.1, 4.0 and 3.5 affected, 3.0 not; fixed
  # in 3.5.10, releases scheduled for 2026-12-01. Grype's database (schema
  # v6.1.10, built 2026-11-26 06:22 UTC, `grype db search --vuln
  # CVE-2026-107494`) has these providers:
  #   Debian  https://security-tracker.debian.org/tracker/CVE-2026-107494
  #           openssl fix=not-fixed in debian 13, 14 and unstable.
  #   Red Hat https://access.redhat.com/security/cve/CVE-2026-107494 (NVD:
  #           https://nvd.nist.gov/vuln/detail/CVE-2026-107494)
  #   Ubuntu  https://ubuntu.com/security/CVE-2026-107494
  #   cve.org https://www.cve.org/CVERecord?id=CVE-2026-107494
  # Because sid is unfixed too, no base-image bump fixes this.
  #
  # QUIC is opt-in: a program must create its connection with a QUIC method
  # (OSSL_QUIC_client_method / OSSL_QUIC_server_method / SSL_new_listener).
  # Same argument as CVE-2026-95691 above. Measured 2026-11-26 on local buildx
  # images of main 93b602c4, both arches, 3.5.9-1~deb13u1, pyelftools over
  # undefined .dynsym imports (757 arm64, 758 amd64 ELFs):
  #   OSSL_QUIC_client_method, SSL_is_quic, SSL_handle_events -> /usr/bin/openssl
  #     only (its `s_client -quic`). No ELF imports a QUIC server method or
  #     SSL_new_listener.
  #   Python side as CVE-2026-95691, re-swept 2026-11-26: no QUIC package is
  #     installed in the image.
  #
  # NOT COVERED: cryptography 50.0.2's static OpenSSL 4.0.3 is in the affected
  # range (fixed in 4.0.4). cryptography has no QUIC API, so it is unreachable;
  # the cryptography bump in WOR-1155 closes this too. ALSO NOT COVERED: a
  # `docker exec` user who runs `openssl s_client -quic` against a hostile
  # server exhausts only their own process.
  #
  # Pinned to the exact Debian version. At expiry, delete these if Debian has
  # shipped 3.5.10; otherwise re-measure with the same sweep on both arches.
  # Delete them at once if anything in the image starts speaking QUIC.
