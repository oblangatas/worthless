  # --- CVE-2026-14456: openssl / libssl3 (QUIC server) -----------------------
  #
  # NOT "unreachable" — NOT PRESENT. This is a stronger claim than the blocks
  # above and it is worth stating precisely, because the obvious remediation
  # makes things WORSE.
  #
  # The bug is unbounded memory growth in OpenSSL's QUIC SERVER listener queue:
  # a peer floods QUIC Initial packets carrying unknown connection IDs, and
  # per-channel state queues without limit until the process dies. CWE-770.
  # OpenSSL themselves rate it LOW; grype reports High from a mechanical CVSS
  # DoS score, not the CNA's assessment.
  #
  # Affected: 3.5.0-3.5.7, 3.6.0-3.6.3, 4.0.0-4.0.1. Per the OpenSSL advisory
  # the defect has existed since 3.5 — the release that ADDED the QUIC server.
  #
  # The advisory (20260813) states it directly:
  #   "OpenSSL 3.4, 3.0, 1.1.1 and 1.0.2 are not affected by this issue."
  # That is upstream declaring 3.0 not-affected. It is the primary evidence
  # here; the measurement below independently confirms it on our exact image.
  #
  # Measured against the exact pinned base digest in our Dockerfile
  # (python:3.13-slim-bookworm@sha256:fcbd8dfc2605..., Debian 12):
  #
  #     $ openssl version
  #     OpenSSL 3.0.20 7 Apr 2026
  #     $ openssl help | grep -ci quic
  #     0
  #     $ dpkg-query -W openssl libssl3
  #     openssl  3.0.20-1~deb12u2
  #     libssl3  3.0.20-1~deb12u2
  #
  # 3.0.20 predates the QUIC server by five minor releases. The vulnerable
  # code is not compiled into this image.
  #
  # `fix=not-fixed` is Debian's own deferral, not an upstream gap. Debian bug
  # #1144615 IS triaged — the tracker records
  #     [trixie] - openssl <postponed> (Minor issue, fix along with future update)
  # with no urgency assigned. Note the note is scoped to TRIXIE; bookworm ships
  # 3.0.20, which upstream lists as not affected at all.
  #
  # DO NOT "FIX" THIS BY BUMPING THE BASE IMAGE.
  #   bookworm (current)  openssl 3.0.20  QUIC absent          -> safe
  #   trixie   (newer)    openssl 3.5.6   INSIDE affected range -> exposed
  # Moving bookworm -> trixie would convert this false positive into a genuine
  # exposure. The older base is the safer one here.
  #
  # Reachability fails twice over even if the code were present: zero
  # aioquic/quic/http3 entries in uv.lock, uvicorn serves HTTP/1.1 and H2 over
  # TCP, and Python's `ssl` module exposes no QUIC API at all. The bug needs an
  # OpenSSL QUIC Listener object under SSL_accept, which cannot be constructed
  # from this stack.
  #
  # Expiry is deliberately SHORTER than the 2027-01-31 block above: this is a
  # false positive on a version upstream calls not-affected, not a long-lived
  # accepted risk. Re-check the Debian tracker at expiry; if bookworm is marked
  # not-affected, DELETE these two entries rather than extending them.
  #
  # What expiry actually does, so nobody is surprised: grype ignores the key,
  # so on 2026-12-01 the CVE stays SUPPRESSED while check_grype_ignore_expiry.py
  # turns the build red. It nags; it does not re-expose. And the trigger being
  # waited on (Debian marking bookworm not-affected) is outside our control, so
  # the likely December outcome is "nothing changed, re-measure and extend".
  #
  # Narrowing by version is NOT possible here yet. grype's IgnoreRule schema
  # accepts package.version, but the check that actually fired on this finding,
  # scripts/hooks/check_grype_unmapped_findings.py, builds its scope from name
  # and type only and silently discards a version key — so a pin would buy
  # nothing until that hook is taught to carry it. Tracked separately.
  #
  # Measured on BOTH architectures: the arm64 resolution of this digest also
  # reports 3.0.20 with zero QUIC symbols, and grype emits the same package
  # names and types, so the weekly arm64 scan is covered by these entries.
  # (Note for a future trixie bump: trixie renames libssl3 -> libssl3t64, so
  # the libssl3 entry stops matching on its own; the openssl entry does not.)
  # WOR-885.
  - vulnerability: CVE-2026-14456
    package: {name: openssl, type: deb}
    reason: "OpenSSL 3.0.20 in the pinned bookworm base; QUIC server was added in 3.5, so the vulnerable code is not present (measured: `openssl help | grep -ci quic` = 0). The advisory states 3.0 is not affected. fix=not-fixed is Debian's postponement (bug #1144615, marked postponed for trixie), not an upstream gap. Do NOT bump to trixie — it ships 3.5.6, inside the affected range. WOR-885."
    expiry: "2026-11-30"
  - vulnerability: CVE-2026-14456
    package: {name: libssl3, type: deb}
    reason: "OpenSSL 3.0.20 in the pinned bookworm base; QUIC server was added in 3.5, so the vulnerable code is not present (measured: `openssl help | grep -ci quic` = 0). The advisory states 3.0 is not affected. fix=not-fixed is Debian's postponement (bug #1144615, marked postponed for trixie), not an upstream gap. Do NOT bump to trixie — it ships 3.5.6, inside the affected range. WOR-885."
    expiry: "2026-11-30"

  # ── OpenSSL 3.0.x, unreachable attack surface (WOR-915) ─────────────
  # NOT the CVE-2026-14456 case above. There, upstream states 3.0 is NOT
  # AFFECTED — the vulnerable code is absent. Here OpenSSL explicitly lists
  # 3.0 as vulnerable, fixed in 3.0.22. Measured inside the pinned base:
  #
  #   openssl 3.0.20-1~deb12u2   (OpenSSL 3.0.20 7 Apr 2026)
  #
  # Debian has shipped no bookworm update, which is what fix=not-fixed means,
  # so there is nowhere to upgrade to. The claim below is therefore the WEAKER
  # one — "we do not call this code" — and must be read as such:
  #
  #   CVE-2026-54874  DTLS record buffering. The proxy is TLS over TCP and
  #                   never opens a DTLS endpoint. Upstream assesses this
  #                   Low; grype reports High.
  #   CVE-2026-63072  Reachable only from CMS_decrypt(). We never parse
  #                   CMS/S-MIME.
  #   CVE-2026-63076  CMP protocol. Upstream: "a specialized feature that an
  #                   application must explicitly enable." We do not.
