    reason: "CPython tarfile; fixed upstream in v3.13.15/v3.14.7 (GH-151988) but grype's NVD record has no version data, so it reports on every version — a base bump does NOT retire this entry. Unreachable: no archive use in src/worthless, enforced by tests/test_archive_reachability.py. WOR-852."
