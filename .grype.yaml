  # so a short fuse on a low-severity, unreachable finding just schedules the
  # outage this entry exists to end. Note the date cannot catch the risk that
  # matters most here — us starting to USE DTLS/CMS/CMP — which is a code
  # change, not a calendar event.
  #
  # DELETE these entries — do not extend them — the moment either becomes
  # true: Debian ships 3.0.22+ for bookworm, or Worthless starts speaking
  # DTLS, CMS, or CMP. The second one silently makes these live.
  # Linear: WOR-915.
