name: Publish to PyPI

on:
  # LOAD-BEARING: push-tags-only. Do NOT add workflow_dispatch or
  # workflow_call. tests/test_deploy_static.py::test_no_skip_path_triggers
  # enforces this.
  #
  # The reason is NOT the one this comment used to give. It claimed
  # `workflow_call` "would publish WITHOUT a signature check" because the
  # verify step was guarded on `event_name == 'push'`. That guard is gone
  # (WOR-892), and it was wrong about `workflow_call` anyway: a called
  # workflow inherits the CALLER's `github` context, so `event_name` there is
  # the caller's event, never the literal `workflow_call` (WOR-891).
  #
  # The real reason: publishing must require pushing a signed `v*` tag,
  # because that push is what the `v-tags-signed` ruleset gates. Any other
  # trigger lets someone with repo-write reach the publish path without ever
  # pushing a tag, bypassing the ruleset entirely. (`environment: pypi` and
  # the trusted-publisher filename pin still bind — this is about the ruleset,
  # not about arbitrary repos publishing.)
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          # Need full history so `git verify-tag` can read the signed tag
          # object; a shallow clone strips signatures (mirrors deploy-worker.yml).
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag GPG signature (fatal — must precede pyproject parse + build)
        # FIRST step after checkout, BY DESIGN. PyPI must publish only from a
        # tag the maintainer GPG-signed: deploy-worker.yml already fails closed
        # on an unsigned tag; this closes the same gap on the publish side.
        # It must run BEFORE the next step (which parses attacker-controlled
        # pyproject.toml) and before `python -m build` (which runs build hooks).
        # Reuses the same verify-tag.sh + repo Variables as deploy-worker.yml.
        #
        # UNCONDITIONAL, BY DESIGN (WOR-892 / WOR-901). This step used to carry
        # `if: github.event_name == 'push'`. Under the push-tags-only `on:`
        # below that condition can never be false, so it was never a defense —
        # it was a trap. Widen `on:` and it flips to false, the step SKIPS, and
        # a skipped step is not a failed step: `build` completes green and the
        # `publish` job's `needs: build` is satisfied, uploading to PyPI with
        # no signature check at all. No `if:` and no `continue-on-error` may be
        # (re)added to any step in this job — TestPublishBuildJobFailsClosed.
        env:
          MAINTAINER_PUBKEY: ${{ vars.MAINTAINER_GPG_PUBKEY }}
          MAINTAINER_FINGERPRINT: ${{ vars.MAINTAINER_GPG_FINGERPRINT }}
        run: bash .github/scripts/verify-tag.sh

      - name: Verify tag matches pyproject version
        # Single sync invariant in the resolve-latest install.sh model:
        # pushed git tag MUST equal the version pinned in pyproject.toml.
        # Without this guard, `skip-existing: true` (set on the publish step)
        # silently dupe-accepts a stale-version build on every v* tag — the
        # exact bug WOR-300 hit on v0.3.1 / v0.3.1-rc1 (pyproject said 0.3.0,
        # tag said 0.3.1, PyPI accepted-and-discarded the duplicate). Failing
        # fast here makes the desync impossible.
        #
        # Uses tomllib (Python 3.11+, available system-wide on ubuntu-latest
        # runners) instead of grep+sed, so dynamic versioning, comments, or
        # multi-line strings in pyproject.toml don't yield false-positive
        # matches.
        #
        # Uses packaging.version.Version for PEP 440-aware comparison so that
        # re-tags like v0.3.8.0 (which PEP 440 treats as identical to 0.3.8)
        # are accepted.  Strict equality first; packaging fallback only when
        # the raw strings differ (covers the re-tag tombstone workaround).
        run: |
          set -euo pipefail
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Injection-safe: TAG_VERSION is attacker-controlled (the git tag name).
          # Export both vars; Python reads them via os.environ — the Python source
          # string never contains ${TAG_VERSION} so shell expansion cannot inject code.
          export PYPROJECT_VERSION TAG_VERSION
          if [ "${PYPROJECT_VERSION}" = "${TAG_VERSION}" ]; then
            echo "OK: tag ${GITHUB_REF_NAME} matches pyproject ${PYPROJECT_VERSION}"
          elif python3 -c "import os,sys; from packaging.version import Version; sys.exit(0 if Version(os.environ['PYPROJECT_VERSION'])==Version(os.environ['TAG_VERSION']) else 1)"; then
            echo "OK: tag ${GITHUB_REF_NAME} (${TAG_VERSION}) is PEP 440-equivalent to pyproject ${PYPROJECT_VERSION}"
          else
            echo "::error title=Tag/pyproject version drift::Pushed tag ${GITHUB_REF_NAME} (=> ${TAG_VERSION}) does not match pyproject.toml version ${PYPROJECT_VERSION}. Bump pyproject.toml first or push a matching tag."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write  # Scoped to publish job only (OIDC for trusted publishing)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
          attestations: true
          # Idempotent: if the version already exists on PyPI (e.g. when a
          # canonical tag is pushed after a successful pre-release upload),
          # skip the upload and exit clean instead of failing the workflow.
          skip-existing: true
