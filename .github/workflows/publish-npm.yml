name: Publish worthless-mcp to npm

on: # zizmor: ignore[cache-poisoning]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment gate required — mirrors publish.yml (PyPI) pattern.
    # npm trusted publishing (OIDC): npm swaps the id-token for a publish
    # credential and adds provenance. NPM_TOKEN stays as a fallback until one
    # release shows attestations, then it is removed. WOR-921.
    environment: npm-publish
    # Job-level permissions replace the workflow-level block, so contents: read
    # is repeated here.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/worthless-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # fetch-depth: 0 required — shallow clones strip the tag object and its
          # GPG signature, causing verify-tag.sh to fail on an otherwise valid tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag GPG signature
        # Mirror of the same gate in publish.yml (PyPI). npm publish must require
        # the same signed-tag guarantee as PyPI — omitting it here would let an
        # attacker with repo write push an unsigned v* tag to npm without GPG check.
        working-directory: ${{ github.workspace }}
        env:
          MAINTAINER_PUBKEY: ${{ vars.MAINTAINER_GPG_PUBKEY }}
          MAINTAINER_FINGERPRINT: ${{ vars.MAINTAINER_GPG_FINGERPRINT }}
        run: bash .github/scripts/verify-tag.sh

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24 ships npm 11.x; trusted publishing needs npm >= 11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Stamp version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REF_NAME#v}"
          # Normalize 4-part PEP 440 re-tag to 3-part semver for npm.
          # ${TAG%.0} strips a literal trailing ".0" — bash substitution, no code
          # injection possible (no Python source interpolation).
          # 0.3.8.0 → 0.3.8 | 0.3.8 → 0.3.8 (unchanged) | 0.3.8.1 → unchanged
          SEMVER="${TAG%.0}"
          echo "Publishing version: ${SEMVER} (from tag ${TAG})"
          npm version "${SEMVER}" --no-git-tag-version --allow-same-version
          echo "SEMVER=${SEMVER}" >> "$GITHUB_ENV"
          if [[ "${SEMVER}" =~ (rc|a|b|alpha|beta) ]]; then
            echo "DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "DIST_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Re-run safe (mirrors PyPI's skip-existing): npm publish errors if the
        # version already exists, so re-driving a half-failed release would fail on
        # this leg. Skip when the exact version is already on the registry. WOR-846.
        # NOTE: the zizmor suppression must live on the `run:` line, as a real YAML
        # comment. Inside a `run: |` block a `#` is literal shell text, so zizmor
        # never sees it and the finding fails the job.
        run: | # zizmor: ignore[use-trusted-publishing]
          if npm view "worthless-mcp@${SEMVER}" version >/dev/null 2>&1; then
            echo "worthless-mcp@${SEMVER} already published — skipping (re-run safe)."
          else
            npm publish --access public --tag "${DIST_TAG}"
          fi
