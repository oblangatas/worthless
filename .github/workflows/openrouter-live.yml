name: Live OpenRouter round-trip

# The only automatic run of a real provider round-trip: lock a real OpenRouter
# key, call through the proxy, prove the value left in .env is rejected by
# OpenRouter, unlock. Every other lane excludes `-m live`. A fraction of a cent
# per run.
#
# Its own workflow, not a job in scheduled.yml: the failure alarm keeps one
# issue per workflow, and an OpenRouter outage, 429 or retired model must not
# hide a real Hypothesis failure behind the same open issue.

on:
  schedule:
    - cron: "43 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openrouter-live:
    name: Live OpenRouter round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false

      - name: Set up uv + Python
        uses: ./.github/actions/setup-uv-python

      # Separate step so no build backend or install hook sees the secret.
      - name: Install dependencies
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        run: uv sync --extra dev --extra test

      # Without the secret the test skips and pytest exits 0 — a green run that
      # proved nothing. Fail instead, so a missing secret is visible.
      # --reruns 0: a rerun doubles the spend and lets a flaky upstream pass.
      - name: Run live OpenRouter test
        env:
          UV_CACHE_DIR: /tmp/uv-cache
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY repo secret is not set"
            exit 1
          fi
          uv run --no-sync pytest tests/live/test_e2e_live.py -m live -k openrouter \
            -n0 --reruns 0 --no-header -q -rs
