name: Deploy website

on:
  pull_request:
    paths:
      - "website/**"
      - "tests/test_website_publish_safety.py"
      - ".github/workflows/deploy-website.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "tests/test_website_publish_safety.py"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:
    inputs:
      republish_stale:
        description: >-
          Emergency only: publish this ref even if main has newer website/
          content. The way back when the live site is broken and waiting for a
          revert to pass every required check is too slow.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # PR runs get their own group. A fixed "github-pages" group for every event
  # means a newly queued PR run cancels a production deploy that is still
  # waiting its turn (GitHub keeps one running + one pending per group, and the
  # newcomer evicts the pending one). Two PR runs were cancelled that way on
  # 2026-06-13; a cancelled deploy is a merge that never reaches wless.io.
  # Only a push to main may hold the deploy lane. Anything else — a pull
  # request, a manual dispatch — gets its own group, so it can never evict a
  # production deploy that is still waiting its turn.
  group: ${{ github.event_name == 'push' && 'github-pages' || format('website-{0}-{1}', github.event_name, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate static website files
        run: |
          test -f website/index.html
          test -f website/CNAME
          test -f website/robots.txt
          test -f website/sitemap.xml
          test -f website/llms.txt
          test -f website/features.html
          test -f website/how-it-works.html
          test -f website/coming-soon.html
          test -f website/memes.html
          test -f website/blog/index.html
          test -f website/.well-known/security.txt
          grep -qx 'wless.io' website/CNAME
          grep -qx 'Canonical: https://wless.io/.well-known/security.txt' website/.well-known/security.txt
          grep -qx 'Sitemap: https://wless.io/sitemap.xml' website/robots.txt
          # No symlinks: upload-pages-artifact tars with --dereference, so a link
          # publishes whatever it points at, while the publish-safety allowlist
          # walks real files and never sees it.
          test -z "$(find website -type l -print -quit)"

      - name: Set up uv + Python
        uses: ./.github/actions/setup-uv-python

      - name: Run website publish-safety tests
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        run: |
          uv sync --extra test
          uv run pytest -q tests/test_website_publish_safety.py

      - name: Upload website preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-preview
          path: website
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    # A manual run may also deploy: without it, the only way back from a bad
    # publish is a revert commit through every required check, and the stale
    # guard below (correctly) blocks the old trick of re-running an old run.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Refuse to deploy stale website content
        # This run deploys its own commit. If main already carries newer
        # website/ content (a later push, or someone re-running an old run —
        # a re-run keeps the ORIGINAL commit), publishing it would silently
        # roll wless.io backwards. Fail loudly instead; the newer run deploys.
        env:
          REPUBLISH_STALE: ${{ inputs.republish_stale }}
        run: |
          git fetch --no-tags --depth=1 origin main
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- website; then
            echo "OK: this commit carries main's current website/ content."
            exit 0
          fi
          if [ "$REPUBLISH_STALE" = "true" ]; then
            echo "::warning::main has newer website/ content than $GITHUB_SHA — republishing older content anyway because republish_stale was requested."
            exit 0
          fi
          echo "::error::main has newer website/ content than $GITHUB_SHA; refusing to deploy stale content."
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
