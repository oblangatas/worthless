name: User-flow CI

# The PR trigger is intentionally UNFILTERED so these checks always report —
# a path-scoped *required* status check that never runs would block every PR
# that doesn't touch these paths forever (worthless-kp4u). The Detect step in
# each matrix leg no-ops the run on PRs that don't touch user-flow-relevant
# paths. Pushes keep the path filter (only fire on relevant changes).

on:
  pull_request:
  push:
    branches:
      - "**"
    paths:
      - "tests/user_flows/**"
      - "src/worthless/cli/**"
      - "src/worthless/storage/**"
      - "src/worthless/crypto/**"
      # worthless-ax9d: user-flow tests drive the real proxy daemon, so a
      # proxy-only change must trigger them. Without this a regression in the
      # request path runs no live guard on push.
      - "src/worthless/proxy/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup-uv-python/**"
      - ".github/workflows/user-flows.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  user-flows:
    name: User flows (${{ matrix.os }}, py3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Detect user-flow-relevant changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Non-PR events (push, workflow_dispatch) reach here only on relevant
          # paths or by explicit dispatch, so always run for them.
          relevant=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            relevant=false
            # Fail open: a transient `gh pr diff` error must not fail this
            # required check and block unrelated PRs — run the suite instead.
            if ! files="$(gh pr diff "${{ github.event.pull_request.number }}" \
              --name-only --repo "${{ github.repository }}")"; then
              echo "::warning::Could not read PR diff; running the user-flow suite (fail-open)."
              relevant=true
              files=""
            fi
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                tests/user_flows/*) relevant=true ;;
                src/worthless/cli/*|src/worthless/storage/*|src/worthless/crypto/*) relevant=true ;;
                # worthless-ax9d added src/worthless/proxy/** to the PUSH path
                # filter above but not to this PR-side list, so a proxy-only PR
                # skipped this whole job — wheel step included. These live tests
                # drive the real proxy daemon; the two lists must agree.
                src/worthless/proxy/*) relevant=true ;;
                pyproject.toml|uv.lock) relevant=true ;;
                .github/actions/setup-uv-python/*) relevant=true ;;
                .github/workflows/user-flows.yml) relevant=true ;;
              esac
            done <<< "$files"
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" = "true" ]; then
            echo "User-flow-relevant paths changed — running the suite."
          else
            echo "No user-flow-relevant paths changed — passing without the run."
          fi

      - name: Check out repository
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false

      - name: Set up uv + Python
        if: steps.detect.outputs.relevant == 'true'
        uses: ./.github/actions/setup-uv-python

      - name: Provision ephemeral keychain + fail-fast access probe (macOS)
        # worthless-fc14: the real-keychain user-flow tests were skipped on CI
        # (worthless-3ynb) because the headless runner's login keychain is locked and
        # `worthless lock`'s Keychain access blocks on a GUI prompt that never comes,
        # hanging the job to its 15-min timeout. Create + unlock a throwaway keychain,
        # try to grant non-interactive item access, then PROBE with python `keyring`
        # (what worthless's keystore uses) under a HARD 5s timeout. Only set the
        # run-flag when the probe passes — so if access still prompts, the tests SKIP
        # cleanly in seconds instead of hanging. pytest-timeout can't rescue us here:
        # the block is a C-level Security.framework call that ignores the signal, so
        # the guard has to live at the workflow level. (The @REQUIRES_SYNC_ENTITLEMENT
        # subset needs a code-signed interpreter and stays skipped regardless.)
        if: runner.os == 'macOS' && steps.detect.outputs.relevant == 'true'
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        shell: bash
        run: |
          set -uo pipefail   # NOT -e: a failed/timed-out probe is handled, not fatal
          KC="$RUNNER_TEMP/wless-ci.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings "$KC"          # no auto-lock timeout
          security unlock-keychain -p "" "$KC"
          security list-keychains -d user -s "$KC"
          security default-keychain -s "$KC"
          # NB: `security set-key-partition-list -S apple-tool:,apple:,unsigned:` was
          # tried here and PROVEN not to help (run 88045781340): it grants signed-tool
          # access to KEYS, not the per-item ACL that python keyring's generic-password
          # items need — the probe below still blocked to the timeout. Deliberately left
          # out rather than kept as a misleading no-op. Don't re-add it without evidence.
          # Sync deps FIRST so the timed probe measures keychain access, not a cold sync.
          uv sync --extra dev --extra test >/dev/null 2>&1 || true
          TIMEOUT="$(command -v timeout || command -v gtimeout || true)"
          if [ -n "$TIMEOUT" ] && "$TIMEOUT" 5 uv run --no-sync python -c 'import keyring; keyring.set_password("wless-ci-probe","u","v"); assert keyring.get_password("wless-ci-probe","u")=="v"; keyring.delete_password("wless-ci-probe","u")'; then
            echo "WORTHLESS_TEST_KEYCHAIN_READY=1" >> "$GITHUB_ENV"
            echo "::notice::keychain probe passed — real-keychain user-flow tests will RUN"
          else
            echo "::warning::keychain not non-interactively accessible (probe timed out/failed); real-keychain user-flow tests SKIP (worthless-fc14)"
          fi

      - name: Run user-flow tests
        if: steps.detect.outputs.relevant == 'true'
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p user-flow-traces
          uv sync --extra dev --extra test
          # --timeout-method=signal: keep this lane on the pre-existing behaviour.
          # The repo default is `thread` (os._exit), which is right for the main
          # parallel suite where a killed worker is expendable and xdist reports
          # it as one honest failure. These journeys drive a live proxy and real
          # subprocesses, and on macOS runners the traffic-metering flow kills its
          # worker; under `thread` that became a crash the worker could not
          # survive, and with restarts enabled a crash-restart loop burned the
          # whole 15m job budget (run 31966179187). `signal` raises inside the
          # test instead, so a slow flow is a reported failure that `--reruns 1`
          # can retry -- exactly how this lane behaved before this PR.
          # --max-worker-restart=2 bounds the blast radius regardless: xdist's
          # default is numprocesses * 4 (dsession.py:556-568), not unlimited as an
          # earlier version of this comment claimed — but 4x is still enough for a
          # deterministically-dying worker to eat the job's 15m budget re-running
          # one test. Two rides out a one-off and fails fast otherwise.
          uv run pytest tests/user_flows -m user_flow --timeout-method=signal --max-worker-restart=2 2>&1 | tee user-flow-traces/pytest-${{ runner.os }}.log

      # worthless-d4h2: the step above proves the BRANCH build works. It cannot
      # catch a defect that only exists once the package is built and installed
      # — the artifact users actually get. Three bugs reached a release past a
      # green suite for exactly this reason (worthless-6xuv/dc26/ax9d), all
      # found by hand on a real install.
      #
      # So: build the wheel, install it the way `curl worthless.sh | sh` does,
      # and re-run the SAME live tests against that binary via
      # WORTHLESS_TEST_BIN. Linux only — these tests need no launchd, and macOS
      # runners cost ~10x for no extra coverage of this specific gap.
      - name: Re-run live tests against an INSTALLED wheel
        if: ${{ steps.detect.outputs.relevant == 'true' && runner.os == 'Linux' }}
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p user-flow-traces
          uv build --wheel
          # find, not `ls` — shellcheck SC2012, and a glob is safer besides.
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -type f | head -1)"
          test -n "$WHEEL" || { echo "no wheel produced by uv build"; exit 1; }
          echo "installing $WHEEL"
          uv tool install --force "$WHEEL"
          BIN="$(uv tool dir --bin)/worthless"
          test -x "$BIN" || { echo "installed entry point missing at $BIN"; exit 1; }
          # Anti-vacuity: name the artifact under test, so a green run can never
          # be silently about the branch copy again.
          echo "wheel binary: $BIN"
          echo "wheel version: $($BIN --version)"
          # Only tests marked `wheel_artifact` can actually see this binary —
          # they spawn it as a subprocess. The rest of tests/user_flows uses
          # typer's CliRunner IN-PROCESS, importing the `uv run` .venv, i.e. the
          # branch source. Running those here would re-prove the branch build a
          # second time under a banner that says "INSTALLED wheel" — the exact
          # looks-covered-proves-nothing failure this whole lane exists to kill.
          # 4 honest tests beat 30 vacuous ones.
          WORTHLESS_TEST_BIN="$BIN" uv run pytest tests/user_flows \
            -m "user_flow and wheel_artifact" \
            2>&1 | tee user-flow-traces/pytest-installed-wheel.log
          # Anti-vacuity: a marker typo or a rename would silently collect zero
          # tests and still exit 0 here. Assert we actually ran some.
          grep -qE '[1-9][0-9]* passed' user-flow-traces/pytest-installed-wheel.log || {
            echo "wheel step collected no passing tests — the guard proved nothing"; exit 1; }
          uv tool uninstall worthless || true

      - name: Render terminal traces
        if: ${{ always() && steps.detect.outputs.relevant == 'true' }}
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        shell: bash
        run: |
          set -euo pipefail
          uv run python tests/user_flows/render_traces.py \
            --output user-flow-traces/TERMINAL_TRACES-${{ runner.os }}.md

      - name: Upload terminal traces
        if: ${{ always() && steps.detect.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: user-flow-traces-${{ runner.os }}-${{ github.run_id }}
          path: user-flow-traces/**
          if-no-files-found: ignore
          retention-days: 14

  windows-deferred:
    name: Windows user flows deferred
    runs-on: windows-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Record deferred coverage
        shell: pwsh
        run: |
          "Windows native user-flow coverage is intentionally deferred for WOR-446 first pass."
          "This job does not claim WSL coverage."
