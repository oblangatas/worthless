# Snyk Open Source (SCA) scan — powers the vulnerability badge on README.
# Code/SAST, IaC, and container scans from the Snyk template were removed:
# Semgrep + Bandit + CodeQL already cover SAST, and we have no container
# registry targets to monitor.

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # Snyk's Python scanner can't read uv.lock, so it would otherwise resolve
      # its own tree from pyproject.toml and report versions we don't ship.
      # Export the locked runtime deps to a format Snyk parses natively.
      - name: Export locked runtime deps for Snyk
        run: uv export --no-dev --no-hashes --format requirements-txt -o requirements.txt
      # Snyk's pip plugin resolves the tree from INSTALLED package metadata, not
      # from the requirements file alone — without this it fails with
      # "Missing required packages" and scans nothing. --system puts them where
      # the plain `python` Snyk shells out to will find them.
      - name: Install locked runtime deps so Snyk can resolve them
        run: uv pip install --system -r requirements.txt
      # Uploads the project snapshot to Snyk.io so the dashboard reflects our
      # actual locked tree. NOT continue-on-error: this step silently failed on
      # every run for months and reported the job green.
      - name: Snyk Open Source monitor
        run: snyk monitor --file=requirements.txt --package-manager=pip
