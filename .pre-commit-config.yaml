# Worthless pre-commit hooks
#
# Runner: prek (Rust, 10x faster) or pre-commit (Python, fallback)
#   prek:       uv tool install prek && prek install && prek install --hook-type commit-msg --hook-type pre-push
#   pre-commit: uv run pre-commit install && uv run pre-commit install --hook-type commit-msg --hook-type pre-push
#
# Run all: prek run --all-files  (or: uv run pre-commit run --all-files)
#
# Layers:
#   1. File hygiene          — fast, catches obvious mistakes
#   2. Secret detection      — gitleaks (SR-04, SR-05)
#   3. Code quality          — ruff, codespell
#   4. Security SAST         — bandit on src/ only
#   5. Worthless-specific    — SR-07, SR-01, segmentation
#   6. Supply chain          — lockfile, vuln scan, dependency hygiene
#   7. Commit message        — conventional commits

repos:
  # ── 1. File hygiene ─────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=800"]  # uv.lock is ~650KB
      - id: detect-private-key          # catches PEM private keys in commits
      - id: check-case-conflict         # prevents case-only filename collisions
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # ── 2. Secret detection (SR-04, SR-05) ──────────────────────────
  # Gitleaks: fastest mature scanner, low false-positive rate.
  # Custom rules in .gitleaks.toml catch SR-05 denylist patterns.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # ── 3. Code quality ────────────────────────────────────────────
  # Ruff config lives in pyproject.toml (TID251 bans `random` module = SR-08)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Codespell: catches typos in code, comments, and docs
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: ["--skip=*.lock,*.json", "--ignore-words-list=shard,shards,te,fpr"]

  # Pyright: static type checking (basic mode src/, strict on crypto/)
  - repo: local
    hooks:
      - id: pyright
        name: "types: pyright (basic mode)"
        language: system
        entry: uv run pyright
        pass_filenames: false
        files: '\.py$'
        stages: [pre-push]   # too slow for commit-time; runs on push like pip-audit

  # Vulture: dead code detection (keeps attack surface minimal)
  - repo: local
    hooks:
      - id: vulture
        name: "dead code: vulture"
        language: system
        entry: uv run vulture src/ --min-confidence 80
        pass_filenames: false
        files: '\.py$'
        stages: [pre-push]

  # Xenon: cyclomatic complexity ceiling (fail if any function hits grade D+)
  - repo: local
    hooks:
      - id: xenon
        name: "complexity: xenon (max C per block)"
        language: system
        entry: uv run xenon src/ --max-absolute C --max-modules B --max-average A
        pass_filenames: false
        files: '\.py$'
        stages: [pre-push]

  # Commit provenance: reject unsigned / wrong-author commits at push time (WOR-589)
  - repo: local
    hooks:
      - id: commit-provenance
        name: "provenance: signed + canonical author (pre-push)"
        language: system
        entry: uv run python scripts/hooks/check_pushed_commit_provenance.py
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Grype has no `expiry` field — it silently drops unknown keys, so a
      # suppression dated 2020 still suppresses today (measured on grype
      # 0.114.0). This hook is the only thing making .grype.yaml's time-boxing
      # real. WOR-852.
      - id: grype-ignore-expiry
        name: "supply chain: grype ignores are dated and current"
        language: system
        entry: uv run python scripts/hooks/check_grype_ignore_expiry.py
        pass_filenames: false
        always_run: true

  # Actionlint: GitHub Actions YAML syntax and logic errors
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # Zizmor: GitHub Actions security scanner (script injection, permissions, etc.)
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.5.2
    hooks:
      - id: zizmor

  # Pip-licenses: block deps with non-permissive licenses (pre-push)
  - repo: local
    hooks:
      - id: pip-licenses
        name: "licenses: no GPL/AGPL deps"
        language: system
        entry: uv run pip-licenses --allow-only "MIT;MIT License;DFSG approved; MIT License;BSD License;BSD-2-Clause;BSD-3-Clause;3-Clause BSD License;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;Apache Software License;Apache Software License; BSD License;Apache Software License; MIT License;Apache-2.0;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;ISC License (ISCL);Python Software Foundation License;PSF-2.0;Mozilla Public License 2.0 (MPL 2.0);MPL-2.0;MPL-2.0 AND MIT;The Unlicense (Unlicense);CC0 1.0 Universal (CC0 1.0) Public Domain Dedication;Historical Permission Notice and Disclaimer (HPND);UNKNOWN;GNU Lesser General Public License v2 or later (LGPLv2+);LGPL-2.1-or-later;GNU General Public License v3 or later (GPLv3+);GNU Affero General Public License v3"
        pass_filenames: false
        stages: [pre-push]

  # ── 4. Security SAST ───────────────────────────────────────────
  # Bandit: fast Python SAST. Semgrep deferred to CI (needs network for --config auto).
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-r", "src/", "-ll"]
        pass_filenames: false

  # ── 5. Worthless-specific guards ────────────────────────────────
  - repo: local
    hooks:
      # SR-07: No == on digest/hash bytes — must use hmac.compare_digest
      - id: no-equality-on-digests
        name: "SR-07: no == on digest bytes"
        language: pygrep
        entry: '\.digest\(\)\s*==|==\s*.*\.digest\(\)'
        files: '\.py$'
        types: [python]

      # Segmentation: worthless-cloud must never be referenced in this repo
      - id: no-cloud-references
        name: "segmentation: no worthless-cloud refs"
        language: pygrep
        entry: 'worthless-cloud'
        files: '\.(py|md|toml|yaml|yml|json|txt)$'
        exclude: '(\.pre-commit-config\.yaml|\.planning/)'
        types_or: [python, markdown, toml, yaml, json, text]

      # SR-01: bytearray for secrets, not bare bytes literals in crypto code
      - id: no-bytes-for-secrets
        name: "SR-01: bytearray for secret material"
        language: pygrep
        entry: ':\s*bytes\s*=.*(?:key|shard|secret|nonce)'
        files: 'src/worthless/crypto/.*\.py$'
        types: [python]

  # ── 6. Supply chain ────────────────────────────────────────────
  - repo: local
    hooks:
      # Verify uv.lock is in sync with pyproject.toml
      - id: uv-lock-check
        name: "supply chain: lockfile integrity"
        language: system
        entry: uv lock --check
        pass_filenames: false
        files: '(pyproject\.toml|uv\.lock)$'

      # Keep the exported manifest (the Snyk badge's scan source) in sync
      # with uv.lock. Snyk's live badge can't parse uv.lock, so the README
      # badge points at this exported, parseable manifest via ?targetFile=.
      # --no-dev scopes it to the runtime tree users actually install.
      #
      # It lives at the REPO ROOT because Snyk imported it there as a monitored
      # project, and Snyk resolves that project by its imported path. Dependabot
      # NINE pull requests against the root copy — each bumping a version
      # a version in GENERATED OUTPUT while uv.lock, which actually resolves
      # dependencies, went untouched. That is now handled by `exclude-paths` in
      # .github/dependabot.yml, NOT by moving this file -- moving it silently
      # broke the Snyk project once already.
      #
      # Do NOT move this out of the repo root. WOR-904.
      - id: uv-export-requirements
        name: "supply chain: export the Snyk badge manifest"
        language: system
        entry: uv export --no-dev --no-hashes --format requirements-txt -o requirements.txt
        pass_filenames: false
        files: '(pyproject\.toml|uv\.lock)$'

  # deptry: catches missing, unused, and transitive deps.
  # Anti-slopsquatting — detects imports of packages not in your dependency tree
  # (LLMs hallucinate package names; attackers register them).
  # Must run from project venv (needs installed package metadata).
  - repo: local
    hooks:
      - id: deptry
        name: "supply chain: dependency hygiene (deptry)"
        language: system
        entry: uv run deptry src/
        pass_filenames: false
        files: '(\.py|pyproject\.toml|uv\.lock)$'

      # Vulnerability scan — pre-push only (slow, needs network)
      - id: uv-audit
        name: "supply chain: vulnerability scan"
        language: system
        # NOTHING is ignored here any more. Both former entries were dropped
        # 2026-08-02 after verifying pip-audit reports clean without them:
        #   PYSEC-2026-2132 : click.edit() injection (CVE-2026-7246). semgrep
        #                     left the lock (now `uvx`-isolated in sast.yml),
        #                     so click resolves to 8.4.2 >= the 8.3.3 fix.
        #                     beads worthless-fnvz.
        #   GHSA-58qw-9mgm-455v : pip tarball handling. pip is still in the
        #                     exported set, but pip-audit no longer reports it,
        #                     so the suppression was hiding nothing. A dead
        #                     ignore is worse than none — it silently absorbs
        #                     the NEXT finding for that package. beads
        #                     worthless-lwvs; reopen if it re-fires.
        # If an ignore is ever needed again it MUST cite its tracking ticket
        # and be re-checked quarterly.
        # `bash -c`, not `sh -c`, and `set -o pipefail` is why. This is a
        # PIPELINE: without pipefail the shell reports only pip-audit's exit
        # code, so a `uv export` that dies partway hands over a truncated-but-
        # valid stream, pip-audit audits the packages that arrived, and the hook
        # passes over a fragment. CI got this fix via `shell: bash`
        # (dependency-audit.yml); the hook was left carrying the defect until
        # now. pipefail is not POSIX — dash, which /bin/sh often is, does not
        # support it — so the shell has to be bash explicitly. beads
        # worthless-mh0r.
        entry: bash -c 'set -o pipefail; uv export --frozen --no-emit-project | uv run pip-audit --disable-pip -r /dev/stdin'
        pass_filenames: false
        stages: [pre-push]

  # ── Lock command regression gate ───────────────────────────────
  # Run the re-lock tests whenever lock.py changes. Prevents the tuple-order
  # class of bug that already landed once (WOR-504) — tests exist but only
  # catch regressions if they actually run.
  - repo: local
    hooks:
      - id: test-lock-rerun
        name: "test: lock re-run contract (TestLockRerun)"
        language: system
        entry: uv run pytest tests/test_cli_lock.py::TestLockRerun -x -q --tb=short
        pass_filenames: false
        files: 'src/worthless/cli/commands/lock\.py$'

  # ── 7. Conventional commits ────────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.1.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - "feat"
          - "fix"
          - "chore"
          - "refactor"
          - "test"
          - "docs"
          - "ci"
          - "build"
          - "perf"
          - "security"
